name: gm-tributario
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diagnostico
      POSTGRES_USER: diagnostico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U diagnostico -d diagnostico]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://diagnostico:${POSTGRES_PASSWORD}@db:5432/diagnostico
      APP_ORIGIN: ${APP_ORIGIN:?Defina o domínio HTTPS}
      TRUST_PROXY: "1"
      HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3087:3001"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
