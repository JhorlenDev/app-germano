    --paper:#101B1F; --surface:#16252A; --ink:#EAF0EF; --ink-soft:#9FB2B4;
    --petroleo:#4FA8BE; --petroleo-dark:#8FCBDA; --petroleo-tint:#1B333B;

  html{ box-sizing:border-box; scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:inherit; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  .font-display{ font-family:'Fraunces', Georgia, serif; }
  .font-mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  ::selection{ background:var(--emerald-tint); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; }
  input[type="text"],input[type="number"]{
    width:100%; background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px;
    font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:14px;
    outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  select{
    width:100%; background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px;
    font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; outline:none;
  }
  input[type="text"]:focus,input[type="number"]:focus,select:focus{
    border-color:var(--petroleo); box-shadow:0 0 0 3px var(--petroleo-tint);
  }
  input[type="range"]{ accent-color: var(--petroleo); width:100%; }
  label.field-label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--petroleo); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
  .badge-glow{ box-shadow:0 0 0 1px var(--emerald), 0 8px 24px -8px rgba(14,143,98,0.35); }

  .dropzone{ border:1.5px dashed var(--line); border-radius:14px; transition:border-color .15s ease, background .15s ease; }
  .dropzone.drag-active{ border-color:var(--emerald); background:var(--emerald-tint); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spin{ animation:spin 0.9s linear infinite; }
  .progress-track{ height:5px; border-radius:99px; background:var(--line-soft); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--petroleo); transition:width .25s ease; }

  @media print{
    body *{ visibility:hidden; }
    #parecer-print, #parecer-print *,
    #memorial-print, #memorial-print *,
    #ncm-print, #ncm-print * { visibility:visible; }
    #parecer-print{ position:absolute; left:0; top:0; width:100%; margin:0; padding:0; }
    #memorial-print{ position:absolute; left:0; top:0; width:100%; margin:0; padding:0; page:memorial; }
    #ncm-print{ position:absolute; left:0; top:0; width:100%; margin:0; padding:0; page:ncmanexo; }
    .no-print{ display:none !important; }
    @page{ size:A4 portrait; margin:18mm 16mm; }
    @page memorial{ size:A4 landscape; margin:12mm; }
    @page ncmanexo{ size:A4 landscape; margin:12mm; }
  }
</style>

const FATOR_R_LIMITE = 0.28;
const LIMITE_SIMPLES = 4800000;
const CBS_ALIQ = 0.088; // alíquota de referência projetada para 2027 (TCU/Senado, LC 214/2025 arts. 18-20 e 349) — ainda sujeita a fixação definitiva por Resolução do Senado, prevista até 15/12 do ano anterior ao início de vigência.
const PRESUNCAO_IRPJ = { comercio: 0.08, industria: 0.08, servicos: 0.32 };
const PRESUNCAO_CSLL = { comercio: 0.12, industria: 0.12, servicos: 0.32 };
// CPP patronal: 20% + RAT (1-3%, ajustado pelo FAP) + contribuições a terceiros (Sistema S, INCRA etc.) incide
// sobre a folha de EMPREGADOS — a soma costuma ser usada como referência de 28,8%. Sobre o PRÓ-LABORE do sócio
// (contribuinte individual), incide apenas o INSS patronal de 20%, sem RAT e sem terceiros (art. 22, III, da
// Lei nº 8.212/1991). No Simples Nacional Anexo IV, quando a CPP é recolhida fora do DAS, aplica-se uma
// alíquota única de 20% tanto sobre a folha quanto sobre o pró-labore (sem RAT/terceiros — regra própria do
// Anexo IV, distinta da CPP "normal" do Lucro Presumido/Real).
const CPP_FOLHA_ALIQ = 0.288;
const CPP_PROLABORE_ALIQ = 0.20;
const CPP_ANEXO_IV_ALIQ = 0.20;

// Fator R = folha de pagamento (12 meses, incl. pró-labore) / RBT12. Usa-se a folha mensal informada x 12 como
// proxy da folha anualizada. Fator R >= 28% -> Anexo III (CPP no DAS); < 28% -> Anexo V (CPP à parte).
function calcFatorR(d) {
  const folha12 = (d.folhaMensal + d.proLabore) * 12;
  const base = Math.max(d.rbt12, 1);
  return Math.min(1, folha12 / base);
}
// `forcado` (III/IV/V) vem de detecção no PGDAS-D ou de escolha manual; sem ele, decide pelo Fator R.
function tabelaServicos(fatorR, forcado) {
  if (forcado === 'III') return { tabela: ANEXO_III, nome: 'III', cppNoDAS: true };
  if (forcado === 'IV') return { tabela: ANEXO_IV, nome: 'IV', cppNoDAS: false };
  if (forcado === 'V') return { tabela: ANEXO_V, nome: 'V', cppNoDAS: true };
  return fatorR >= FATOR_R_LIMITE ? { tabela: ANEXO_III, nome: 'III', cppNoDAS: true } : { tabela: ANEXO_V, nome: 'V', cppNoDAS: true };
}

const fmtBRL = (v) => (isFinite(v) ? v : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fmtBRL2 = (v) => (isFinite(v) ? v : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 2 });
const fmtPct = (v) => (isFinite(v) ? v * 100 : 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
const fmtBytes = (b) => b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(1)} MB`;

function faixaSimples(rbt12, tabela) {
  const excede = rbt12 > LIMITE_SIMPLES;
  const base = Math.min(Math.max(rbt12, 0.01), LIMITE_SIMPLES);
  const faixa = tabela.find(f => base >= f.min && base <= f.max) || tabela[tabela.length - 1];
  const aliqEfetiva = Math.max(0, (base * faixa.aliq - faixa.pd) / base);
  return { faixa, aliqEfetiva, excede };
}

const MESES_ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function formatCompetencia(c) {
  if (!c) return null;
  const m = /^(\d{4})-(\d{2})$/.exec(c);
  if (!m) return c;
  const idx = parseInt(m[2], 10) - 1;
  return `${MESES_ABREV[idx] || m[2]}/${m[1]}`;
}

function aliqCBSComercio(beneficios) {
  const cesta = Math.max(0, beneficios.cestaPct || 0);
  const red60 = Math.max(0, beneficios.reduzido60Pct || 0);
  const padrao = Math.max(0, 100 - cesta - red60);
  const excedeSoma = cesta + red60 > 100;
  const aliq = (cesta * 0 + red60 * (CBS_ALIQ * 0.40) + padrao * CBS_ALIQ) / 100;
  return { cesta, red60, padrao, excedeSoma, aliq };
}
function aliqCBSServicos(beneficios) {
  let aliq = CBS_ALIQ, label = 'Padrão (alíquota de referência, sem redução)';
  if (beneficios.categoria === 'regulamentada') { aliq = CBS_ALIQ * 0.70; label = 'Profissão regulamentada — art. 127 LC 214/2025 (redução de 30%)'; }
  else if (beneficios.categoria === 'saude_educacao') { aliq = CBS_ALIQ * 0.40; label = 'Serviços de saúde ou educação (redução de 60%)'; }
  else if (beneficios.categoria === 'personalizado') { aliq = (beneficios.aliqPersonalizada || 8.8) / 100; label = 'Alíquota personalizada (ajuste manual)'; }
  return { aliq, label };
}

/* ============================= CORE TAX ENGINE ============================= */
function computeRegimes(d) {
  const setor = d.setor;
  const fatorR = setor === 'servicos' ? calcFatorR(d) : null;
  const infoAnexoServicos = setor === 'servicos' ? tabelaServicos(fatorR, d.anexoServicosForcado) : null;
  const tabela = setor === 'comercio' ? ANEXO_I : setor === 'industria' ? ANEXO_II : infoAnexoServicos.tabela;
  const nomeAnexo = setor === 'comercio' ? 'I' : setor === 'industria' ? 'II' : infoAnexoServicos.nome;
  const cppNoDAS = setor === 'servicos' ? infoAnexoServicos.cppNoDAS : true;
  const { faixa, aliqEfetiva, excede } = faixaSimples(d.rbt12, tabela);

  const dasTradicionalTabela = d.faturamentoMensal * aliqEfetiva;
  const cppSeparado = cppNoDAS ? 0 : CPP_ANEXO_IV_ALIQ * (d.folhaMensal + d.proLabore);
  const dasTradicional = dasTradicionalTabela + cppSeparado;

  const reducaoPct = faixa.percCBS / 100;
  const dasHibridoBase = dasTradicionalTabela * (1 - reducaoPct);

  const aliqCBSVendas = setor === 'servicos' ? aliqCBSServicos(d.beneficios.servicos).aliq : aliqCBSComercio(d.beneficios.comercio).aliq;
  const cbsDebito = d.faturamentoMensal * aliqCBSVendas;
  const cbsCreditoBase = d.comprasMensais * (d.pctFornecedorRegimeNormal / 100);
  const cbsCredito = cbsCreditoBase * CBS_ALIQ;
  const cbsLiquidoHibrido = Math.max(0, cbsDebito - cbsCredito);
  const totalHibrido = dasHibridoBase + cbsLiquidoHibrido + cppSeparado;

  const baseIRPJ = PRESUNCAO_IRPJ[setor] * d.faturamentoMensal;
  const irpj = baseIRPJ * 0.15 + Math.max(0, baseIRPJ - 20000) * 0.10;
  const baseCSLL = PRESUNCAO_CSLL[setor] * d.faturamentoMensal;
  const csll = baseCSLL * 0.09;
  const cpp = CPP_FOLHA_ALIQ * d.folhaMensal + CPP_PROLABORE_ALIQ * d.proLabore;
  const cbsLiquidoPresumido = Math.max(0, cbsDebito - cbsCredito);
  let icmsLiquido = 0, iss = 0;
  if (setor !== 'servicos') {
    const icmsDebito = (d.aliquotaEstMun / 100) * d.faturamentoMensal;
    const icmsCredito = (d.aliquotaEstMun / 100) * d.comprasMensais;
    icmsLiquido = Math.max(0, icmsDebito - icmsCredito);
  } else {
    iss = (d.aliquotaEstMun / 100) * d.faturamentoMensal;
  }
  const totalPresumido = irpj + csll + cpp + icmsLiquido + iss + cbsLiquidoPresumido;

  const cbsLinhaLabel = `CBS a recolher (débito ${fmtPct(aliqCBSVendas)} − crédito ${fmtPct(CBS_ALIQ)})`;
  const cppSeparadaLabel = 'CPP patronal (20% s/ folha + pró-labore — Anexo IV, recolhida à parte, fora do DAS)';
  const irpjLabel = setor === 'servicos' ? 'IRPJ (base 32% + adicional)' : 'IRPJ (base 8% + adicional)';
  const csllLabel = setor === 'servicos' ? 'CSLL (base 32%)' : 'CSLL (base 12%)';

  const regimes = {
    tradicional: {
      label: 'Simples Nacional Tradicional', mensal: dasTradicional,
      linhas: [
        { label: `DAS integral (Anexo ${nomeAnexo} · alíq. efetiva ${fmtPct(aliqEfetiva)})`, valor: dasTradicionalTabela, grupo: 'unificado' },
        ...(cppNoDAS ? [] : [{ label: cppSeparadaLabel, valor: cppSeparado, grupo: 'previdenciario' }]),
      ],
    },
    hibrido: {
      label: 'Simples Nacional Híbrido', mensal: totalHibrido,
      linhas: [
        { label: `DAS reduzido (−${(reducaoPct * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 })}% · parcela de Cofins/PIS→CBS/IBS da faixa, Anexo ${nomeAnexo})`, valor: dasHibridoBase, grupo: 'unificado' },
        { label: cbsLinhaLabel, valor: cbsLiquidoHibrido, grupo: 'federal' },
        ...(cppNoDAS ? [] : [{ label: cppSeparadaLabel, valor: cppSeparado, grupo: 'previdenciario' }]),
      ],
    },
    presumido: {
      label: 'Lucro Presumido', mensal: totalPresumido,
      linhas: setor !== 'servicos' ? [
        { label: irpjLabel, valor: irpj, grupo: 'federal' },
        { label: csllLabel, valor: csll, grupo: 'federal' },
        { label: cbsLinhaLabel, valor: cbsLiquidoPresumido, grupo: 'federal' },
        { label: `ICMS a recolher (débito − crédito, ${d.aliquotaEstMun}%)`, valor: icmsLiquido, grupo: 'estadual' },
        { label: 'CPP patronal (28,8% s/ folha + 20% s/ pró-labore)', valor: cpp, grupo: 'previdenciario' },
      ] : [
        { label: irpjLabel, valor: irpj, grupo: 'federal' },
        { label: csllLabel, valor: csll, grupo: 'federal' },
        { label: cbsLinhaLabel, valor: cbsLiquidoPresumido, grupo: 'federal' },
        { label: `ISS municipal (${d.aliquotaEstMun}%, cumulativo)`, valor: iss, grupo: 'municipal' },
        { label: 'CPP patronal (28,8% s/ folha + 20% s/ pró-labore)', valor: cpp, grupo: 'previdenciario' },
      ],
    },
  };

  const keys = ['tradicional', 'hibrido', 'presumido'];
  let melhor = keys[0];
  keys.forEach(k => { if (regimes[k].mensal < regimes[melhor].mensal) melhor = k; });
  keys.forEach(k => { regimes[k].anual = regimes[k].mensal * 12; regimes[k].cargaEfetiva = d.faturamentoMensal > 0 ? regimes[k].mensal / d.faturamentoMensal : 0; });

  return { regimes, melhor, excede, aliqEfetiva, faixa, cbsDebito, cbsCredito, aliqCBSVendas, fatorR, nomeAnexo, cppNoDAS };
}

// Calcula os 3 regimes para um único mês do demonstrativo cronológico, usando o RBT12 e os benefícios
// fiscais atualmente configurados no simulador (a alíquota efetiva do Simples e a alíquota de CBS
// ponderada não variam mês a mês nesta amostra — apenas faturamento, compras e folha).
function computeMesRegimes(d, mes) {
  const setor = d.setor;
  const fatorR = setor === 'servicos' ? calcFatorR(d) : null;
  const infoAnexoServicos = setor === 'servicos' ? tabelaServicos(fatorR, d.anexoServicosForcado) : null;
  const tabela = setor === 'comercio' ? ANEXO_I : setor === 'industria' ? ANEXO_II : infoAnexoServicos.tabela;
  const cppNoDAS = setor === 'servicos' ? infoAnexoServicos.cppNoDAS : true;
  const { faixa, aliqEfetiva } = faixaSimples(d.rbt12, tabela);
  const dasTradTabela = mes.faturamento * aliqEfetiva;
  const cppSeparado = cppNoDAS ? 0 : CPP_ANEXO_IV_ALIQ * mes.folha;
  const dasTrad = dasTradTabela + cppSeparado;

  const reducaoPct = faixa.percCBS / 100;
  const dasHibridoBase = dasTradTabela * (1 - reducaoPct);
  const aliqCBSVendas = setor === 'servicos' ? aliqCBSServicos(d.beneficios.servicos).aliq : aliqCBSComercio(d.beneficios.comercio).aliq;
  const cbsDebito = mes.faturamento * aliqCBSVendas;
  const cbsCredito = mes.comprasRegimeNormal * CBS_ALIQ;
  const cbsLiquido = Math.max(0, cbsDebito - cbsCredito);
  const totalHibrido = dasHibridoBase + cbsLiquido + cppSeparado;

  const baseIRPJ = PRESUNCAO_IRPJ[setor] * mes.faturamento;
  const irpj = baseIRPJ * 0.15 + Math.max(0, baseIRPJ - 20000) * 0.10;
  const baseCSLL = PRESUNCAO_CSLL[setor] * mes.faturamento;
  const csll = baseCSLL * 0.09;
  // O demonstrativo de 6 meses guarda "folha" como um único valor mensal (folha de funcionários + pró-labore
  // somados), sem separar as duas parcelas como no simulador principal — por isso aplica-se aqui a alíquota
  // cheia (28,8%) sobre o total, o que pode SUPERESTIMAR levemente a CPP quando há pró-labore relevante no mês
  // (que teria direito à alíquota menor de 20%, sem RAT/terceiros). Para o valor exato, ver o Memorial de
  // Cálculo, que usa os campos separados de folha e pró-labore do mês-base.
  const cpp = CPP_FOLHA_ALIQ * mes.folha;
  let icmsLiquido = 0, iss = 0;
  if (setor !== 'servicos') {
    const icmsDebito = (d.aliquotaEstMun / 100) * mes.faturamento;
    const icmsCredito = (d.aliquotaEstMun / 100) * mes.comprasRegimeNormal;
    icmsLiquido = Math.max(0, icmsDebito - icmsCredito);
  } else {
    iss = (d.aliquotaEstMun / 100) * mes.faturamento;
  }
  const totalPresumido = irpj + csll + cpp + icmsLiquido + iss + cbsLiquido;

  const valores = { tradicional: dasTrad, hibrido: totalHibrido, presumido: totalPresumido };
  const keys = ['tradicional', 'hibrido', 'presumido'];
  let melhor = keys[0], pior = keys[0];
  keys.forEach(k => { if (valores[k] < valores[melhor]) melhor = k; if (valores[k] > valores[pior]) pior = k; });
  const economia = valores[pior] - valores[melhor];
  const efetivas = {
    tradicional: mes.faturamento > 0 ? dasTrad / mes.faturamento : 0,
    hibrido: mes.faturamento > 0 ? totalHibrido / mes.faturamento : 0,
    presumido: mes.faturamento > 0 ? totalPresumido / mes.faturamento : 0,
  };
  return { ...valores, melhor, pior, economia, efetivas, aliqEfetiva, nomeAnexo: setor === 'comercio' ? 'I' : setor === 'industria' ? 'II' : infoAnexoServicos.nome, cppNoDAS, faixa };
}

/* ============================= DOCUMENT PARSER (100% client-side) ============================= */
function parseCurrencyBR(str) {
  if (!str) return null;
  let s = str.trim();
  if (/,\d{2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function numberNear(text, keywordRegex) {
  const m = keywordRegex.exec(text);
  if (!m) return null;
  const val = m[m.length - 1];
  return parseCurrencyBR(val);
}
const NUM = String.raw`([\d]{1,3}(?:\.\d{3})*(?:,\d{2})?|\d+(?:,\d{2})?)`;

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ''));
    r.onerror = () => reject(new Error('read failed'));
    r.readAsText(file, 'utf-8');
  });
}
function crudeTextFromBinary(raw) {
  const tj = raw.match(/\(([^()\\]{1,200})\)\s*Tj/g) || [];
  const fromTj = tj.map(m => m.replace(/\)\s*Tj$/, '').replace(/^\(/, '')).join(' ');
  const printable = (raw.match(/[ -~]{4,}/g) || []).join(' ');
  return (fromTj + ' ' + printable).slice(0, 200000);
}
function extractCNAE(text) {
  const m = /CNAE[^\d]{0,20}(\d{4}[-\/]?\d?[-\/]?\d{0,2})/i.exec(text);
  return m ? m[1] : null;
}
// Reconhece, no texto do extrato do PGDAS-D, qual Anexo/segmento do Simples Nacional a empresa está
// apurando — usado para calibrar automaticamente o setor e, no caso de serviços, o Anexo III/IV/V.
function detectAnexoPGDAS(text) {
  const t = (text || '').toLowerCase();
  if (/anexo\s*iv\b|constru[cç][aã]o\s*civil|servi[cç]os?\s*com\s*recolhimento\s*de\s*cpp\s*fora/.test(t)) return { setor: 'servicos', anexo: 'IV' };
  if (/anexo\s*v\b|fator\s*r/.test(t)) return { setor: 'servicos', anexo: 'V' };
  if (/anexo\s*iii\b|loca[cç][aã]o\s*de\s*bens|presta[cç][aã]o\s*de\s*servi[cç]os/.test(t)) return { setor: 'servicos', anexo: 'III' };
  if (/anexo\s*ii\b|venda\s*de\s*mercadorias\s*industrializadas|ind[uú]stria/.test(t)) return { setor: 'industria', anexo: 'II' };
  if (/anexo\s*i\b|revenda\s*de\s*mercadorias|com[eé]rcio/.test(t)) return { setor: 'comercio', anexo: 'I' };
  return null;
}
function formatCNPJDisplay(digits) {
  if (!digits || digits.length !== 14) return digits || '—';
  return `${digits.slice(0, 2)}.${digits.slice(2, 5)}.${digits.slice(5, 8)}/${digits.slice(8, 12)}-${digits.slice(12, 14)}`;
}
// Quando o contador digita o CNPJ manualmente (sem subir nenhum documento), este helper fixa o CNPJ mestre
// assim que o número completo (14 dígitos) é digitado — do contrário, o cadastro nunca travava por digitação
// manual (só travava via upload de Cartão CNPJ/PGDAS-D/XML), e sem essa trava o cliente nunca era salvo
// automaticamente na carteira local, mesmo com todos os campos preenchidos.
function aplicarCnpjDigitado(valor) {
  const digits = valor.replace(/\D/g, '');
  const patch = { cnpj: valor };
  if (digits.length === 14) {
    patch.cnpj = formatCNPJDisplay(digits);
    patch.cnpjMestreLocked = true;
  }
  return patch;
}
// Localiza o primeiro CNPJ (14 dígitos) mencionado no texto de um documento (Cartão CNPJ, PGDAS-D, folha).
function extractCNPJFromText(text) {
  const matches = (text || '').match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g);
  if (!matches) return null;
  for (const m of matches) {
    const digits = m.replace(/\D/g, '');
    if (digits.length === 14) return digits;
  }
  return null;
}
function extractRazaoSocial(text) {
  const m = /(NOME EMPRESARIAL|RAZ[AÃ]O SOCIAL)[:\s\-]{1,10}([A-ZÀ-Ü0-9 .,&\-]{5,90})/i.exec(text);
  return m ? m[2].trim().replace(/\s{2,}/g, ' ') : null;
}
function extractCNAEFromCartao(text) {
  const m = /(\d{2}\.?\d{2}-?\d-?\d{2})/.exec(text);
  return m ? m[1] : null;
}
function extractMunicipioUF(text) {
  const mm = /MUNIC[IÍ]PIO[:\s\-]{1,10}([A-ZÀ-Ü ]{3,40})/i.exec(text);
  const uf = /\bUF[:\s\-]{1,5}([A-Z]{2})\b/.exec(text);
  if (mm && uf) return `${mm[1].trim()} - ${uf[1]}`;
  if (mm) return mm[1].trim();
  if (uf) return uf[1];
  return null;
}

// Tenta identificar a competência (YYYY-MM) de um XML a partir da data de emissão.
function extractCompetenciaXML(doc) {
  const el = doc.querySelector('ide > dhEmi') || doc.querySelector('ide > dEmi');
  if (!el) return null;
  const m = /^(\d{4})-(\d{2})/.exec(el.textContent.trim());
  return m ? `${m[1]}-${m[2]}` : null;
}
// Tenta identificar a competência (YYYY-MM) a partir do texto ou do nome de um PDF/TXT.
function extractCompetenciaFromText(text, filename) {
  const src1 = filename || '', src2 = text || '';
  let m = /(\d{2})\/(20\d{2})/.exec(src2) || /(\d{2})\/(20\d{2})/.exec(src1);
  if (m) return `${m[2]}-${m[1]}`;
  m = /(20\d{2})[-_]?(0[1-9]|1[0-2])\b/.exec(src1) || /(20\d{2})[-_]?(0[1-9]|1[0-2])\b/.exec(src2);
  if (m) return `${m[1]}-${m[2]}`;
  return null;
}

// Parser bruto do XML: apenas extrai os campos, sem decidir direção/titularidade — isso é feito na
// etapa de validação cruzada por CNPJ mestre (finalizeFile).
function parseNFeXML(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (doc.querySelector('parsererror')) return null;
  const isNFe = doc.querySelector('infNFe') || doc.querySelector('NFe') || doc.querySelector('ide');
  if (!isNFe) return null;

  const modEl = doc.querySelector('ide > mod');
  const mod = modEl ? modEl.textContent.trim() : null;
  const vNFEl = doc.querySelector('total > ICMSTot > vNF') || doc.querySelector('ICMSTot > vNF') || doc.querySelector('vNF');
  const vNF = vNFEl ? parseFloat(vNFEl.textContent) : 0;
  const emitCNPJEl = doc.querySelector('emit > CNPJ');
  const emitCNPJ = emitCNPJEl ? emitCNPJEl.textContent.trim() : null;
  const destCNPJEl = doc.querySelector('dest > CNPJ');
  const destCNPJ = destCNPJEl ? destCNPJEl.textContent.trim() : null;
  const destCPFEl = doc.querySelector('dest > CPF');
  const crtEl = doc.querySelector('emit > CRT');
  const crt = crtEl ? crtEl.textContent.trim() : null;
  const ufEmitEl = doc.querySelector('emit > enderEmit > UF') || doc.querySelector('enderEmit > UF');
  const ufEmit = ufEmitEl ? ufEmitEl.textContent.trim().toUpperCase() : null;

  const detEls = Array.from(doc.querySelectorAll('det'));
  const porCategoria = { cesta: 0, reduzido60: 0, padrao: 0 };
  const itensNCM = [];
  let cClassTribAmostra = null;
  let temInsumoIndustrial = false;
  const CFOP_INDUSTRIAIS = new Set(['1101', '2101', '1124', '2124', '1253', '2253', '1102', '2102', '1551', '2551']);
  detEls.forEach(det => {
    const prod = det.querySelector('prod');
    if (!prod) return;
    const ncmEl = prod.querySelector('NCM');
    const xProdEl = prod.querySelector('xProd');
    const vProdEl = prod.querySelector('vProd');
    const cfopEl = prod.querySelector('CFOP');
    const vProd = vProdEl ? (parseFloat(vProdEl.textContent) || 0) : 0;
    const ncm = ncmEl ? ncmEl.textContent.trim() : null;
    const cat = classifyNCM(ncm);
    porCategoria[cat] += vProd;
    itensNCM.push({ ncm, descricao: xProdEl ? xProdEl.textContent.trim() : null, vProd, categoria: cat });
    if (cfopEl && CFOP_INDUSTRIAIS.has(cfopEl.textContent.trim())) temInsumoIndustrial = true;
    if (!cClassTribAmostra) {
      const cct = det.querySelector('cClassTrib');
      if (cct && cct.textContent.trim()) cClassTribAmostra = cct.textContent.trim();
    }
  });

  const competencia = extractCompetenciaXML(doc);
  return { mod, vNF: vNF || 0, emitCNPJ, destCNPJ, destCPF: destCPFEl ? destCPFEl.textContent.trim() : null, crt, ufEmit, porCategoria, itensNCM, cClassTribAmostra, competencia, temInsumoIndustrial };
}

// Etapa 1 — leitura bruta do arquivo, sem decidir titularidade (isso acontece em finalizeFile,
// depois que o CNPJ mestre é conhecido).
async function parseFileRaw(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const base = { id: `${file.name}-${file.size}-${Math.random().toString(36).slice(2, 8)}`, name: file.name, size: file.size, ext };
  try {
    if (ext === 'xml') {
      const text = await readFileAsText(file);
      const parsed = parseNFeXML(text);
      if (!parsed) return { ...base, parseStatus: 'erro', parseBadgeBase: 'XML não reconhecido como NF-e/NFC-e' };
      return { ...base, ...parsed, ownCNPJ: parsed.emitCNPJ, parseStatus: 'ok', parseBadgeBase: '' };
    }
    if (ext === 'txt' || ext === 'pdf') {
      const text = ext === 'txt' ? await readFileAsText(file) : crudeTextFromBinary(await readFileAsText(file));
      const lower = text.toLowerCase();
      const nameLower = file.name.toLowerCase();
      const cnae = extractCNAE(text);
      const competencia = extractCompetenciaFromText(text, file.name);
      const compNote = competencia ? ` · competência ${formatCompetencia(competencia)}` : '';
      const ownCNPJ = extractCNPJFromText(text);

      const looksCartao = /cart[aã]o\s*cnpj|comprovante\s*de\s*inscri[cç][aã]o|situa[cç][aã]o\s*cadastral/i.test(lower) || /cartao.?cnpj|comprovante/i.test(nameLower);
      const looksPgdas = !looksCartao && (/pgdas|rbt\s*-?\s*12|simples\s*nacional/i.test(lower) || /pgdas|das/i.test(nameLower));
      const looksFolha = !looksCartao && (/folha\s*(de\s*)?pagamento|pr[oó]-?labore|esocial|dctfweb|inss/i.test(lower) || /folha|esocial|dctf/i.test(nameLower));

      if (looksCartao) {
        const razaoSocialDetectada = extractRazaoSocial(text);
        const cnaeDetectado = extractCNAEFromCartao(text);
        const municipioUFDetectado = extractMunicipioUF(text);
        return {
          ...base, tipo: 'cartao_cnpj', competencia, ownCNPJ,
          dados: {}, razaoSocialDetectada, cnaeDetectado, municipioUFDetectado,
          parseStatus: ownCNPJ ? 'ok' : 'estimado',
          parseBadgeBase: `Cartão CNPJ identificado${razaoSocialDetectada ? ' · razão social extraída' : ''}${cnaeDetectado ? ' · CNAE extraído' : ''}${municipioUFDetectado ? ' · município/UF extraído' : ''}${compNote}`,
        };
      }
      if (looksPgdas) {
        const rbt12 = numberNear(text, new RegExp(`RBT[\\s-]*12[^\\d]{0,20}${NUM}`, 'i'));
        const faturamento = numberNear(text, new RegExp(`(receita\\s*bruta|faturamento)[^\\d]{0,25}${NUM}`, 'i'));
        const anexoDetectado = detectAnexoPGDAS(text);
        const anexoNote = anexoDetectado ? ` · Anexo ${anexoDetectado.anexo} identificado` : '';
        return {
          ...base, tipo: 'pgdas', competencia, ownCNPJ, dados: { rbt12, faturamento, cnae }, anexoDetectado,
          parseStatus: (rbt12 || faturamento) ? 'ok' : 'estimado',
          parseBadgeBase: (rbt12 || faturamento)
            ? `PGDAS-D processado${rbt12 ? ' · RBT12 extraído' : ''}${faturamento ? ' · faturamento extraído' : ''}${cnae ? ' · CNAE identificado' : ''}${anexoNote}${compNote}`
            : `PGDAS-D identificado · valores não localizados no texto (estimados — confira manualmente)${anexoNote}${compNote}`,
        };
      }
      if (looksFolha) {
        const folha = numberNear(text, new RegExp(`(total\\s*(da\\s*)?folha|folha\\s*bruta|folha\\s*(de\\s*)?pagamento)[^\\d]{0,25}${NUM}`, 'i'));
        const proLabore = numberNear(text, new RegExp(`pr[oó]-?labore[^\\d]{0,20}${NUM}`, 'i'));
        return {
          ...base, tipo: 'folha', competencia, ownCNPJ, dados: { folha, proLabore, cnae },
          parseStatus: (folha || proLabore) ? 'ok' : 'estimado',
          parseBadgeBase: (folha || proLabore)
            ? `Folha de Pagamento identificada${folha ? ' · total bruto extraído' : ''}${proLabore ? ' · pró-labore extraído' : ''}${compNote}`
            : `Folha de Pagamento identificada · valores não localizados no texto (estimados — confira manualmente)${compNote}`,
        };
      }
      return {
        ...base, tipo: 'desconhecido', competencia, ownCNPJ, dados: { cnae },
        parseStatus: 'estimado',
        parseBadgeBase: ext === 'pdf'
          ? 'PDF processado localmente, sem padrão reconhecido — modo estimativa (ajuste os campos manualmente)'
          : 'Arquivo de texto sem padrão reconhecido — modo estimativa (ajuste os campos manualmente)',
      };
    }
    return { ...base, parseStatus: 'erro', parseBadgeBase: 'Formato não suportado (aceitos: .xml, .pdf, .txt)' };
  } catch (e) {
    return { ...base, parseStatus: 'erro', parseBadgeBase: 'Falha ao processar o arquivo' };
  }
}

// Etapa 2 — trava de integridade: valida cada arquivo contra o CNPJ mestre da empresa em análise.
function finalizeFile(r, master, isMasterSource) {
  const rec = { id: r.id, name: r.name, size: r.size, ext: r.ext, competencia: r.competencia || null };
  if (r.parseStatus === 'erro') { rec.status = 'erro'; rec.tipo = 'erro'; rec.badge = r.parseBadgeBase; rec.dados = {}; return rec; }

  if (r.ext === 'xml') {
    if (!master) {
      rec.status = 'estimado'; rec.tipo = 'desconhecido'; rec.dados = {};
      rec.badge = 'XML lido, mas o CNPJ mestre ainda não foi definido — envie um Cartão CNPJ, PGDAS-D, ou informe o CNPJ manualmente.';
      return rec;
    }
    const cctNote = r.cClassTribAmostra ? ` · cClassTrib: ${r.cClassTribAmostra}` : '';
    const compNote = r.competencia ? ` · competência ${formatCompetencia(r.competencia)}` : '';
    if (r.emitCNPJ === master) {
      const ufNote = r.ufEmit ? ` · UF ${r.ufEmit}` : '';
      if (r.mod === '65') {
        rec.status = 'ok'; rec.tipo = 'nfce_saida';
        rec.badge = `Aprovado: vinculado com sucesso à empresa · NFC-e (mod. 65) · Saída B2C identificada${cctNote}${compNote}${ufNote}`;
        rec.dados = { vNF: r.vNF, isB2B: false, porCategoria: r.porCategoria, ufEmit: r.ufEmit, itensNCM: r.itensNCM };
      } else {
        const isB2B = !!r.destCNPJ;
        rec.status = 'ok'; rec.tipo = 'nfe_saida';
        rec.badge = `Aprovado: vinculado com sucesso à empresa · XML Saída lido (${isB2B ? 'B2B — CNPJ dest.' : 'B2C — CPF/consumidor'})${cctNote}${compNote}${ufNote}`;
        rec.dados = { vNF: r.vNF, isB2B, porCategoria: r.porCategoria, ufEmit: r.ufEmit, itensNCM: r.itensNCM };
      }
    } else if (r.destCNPJ === master) {
      const credito = r.crt === '3';
      const insumoNote = r.temInsumoIndustrial ? ' · insumo industrial identificado (CFOP)' : '';
      rec.status = 'ok'; rec.tipo = 'nfe_entrada';
      rec.badge = `Aprovado: vinculado com sucesso à empresa · XML Entrada lido (fornecedor ${credito ? 'Regime Normal — gera crédito de CBS' : 'Simples Nacional — sem crédito pleno'})${insumoNote}${compNote}`;
      rec.dados = { vNF: r.vNF, credito };
    } else {
      const divergente = r.emitCNPJ || r.destCNPJ || null;
      rec.status = 'rejeitado'; rec.tipo = 'rejeitado'; rec.dados = {};
      rec.badge = divergente
        ? `REJEITADO: o arquivo "${r.name}" pertence ao CNPJ ${formatCNPJDisplay(divergente)}, incompatível com a empresa em análise (${formatCNPJDisplay(master)}). O arquivo foi descartado e não compõe o cálculo.`
        : `REJEITADO: não foi possível identificar o CNPJ do arquivo "${r.name}" para validação cruzada. O arquivo foi descartado por segurança.`;
    }
    return rec;
  }

  // Documentos em texto (Cartão CNPJ, PGDAS-D, folha, desconhecido)
  if (master && r.ownCNPJ && r.ownCNPJ !== master) {
    rec.status = 'rejeitado'; rec.tipo = 'rejeitado'; rec.dados = {};
    rec.badge = `REJEITADO: o arquivo "${r.name}" pertence ao CNPJ ${formatCNPJDisplay(r.ownCNPJ)}, incompatível com a empresa em análise (${formatCNPJDisplay(master)}). O arquivo foi descartado e não compõe o cálculo.`;
    return rec;
  }
  rec.status = r.parseStatus; rec.tipo = r.tipo; rec.dados = r.dados; rec.anexoDetectado = r.anexoDetectado || null;
  const prefix = isMasterSource ? 'CNPJ mestre definido a partir deste documento · '
    : (r.ownCNPJ ? 'Aprovado: vinculado com sucesso à empresa · ' : '');
  const unverified = (!r.ownCNPJ && master) ? ' · CNPJ não localizado no documento — validação cruzada não aplicada' : '';
  rec.badge = prefix + r.parseBadgeBase + unverified;
  return rec;
}

function aggregateFiles(arquivos) {
  const agg = {
    faturamentoSaida: 0, comprasEntrada: 0, comprasComCredito: 0, vendasB2B: 0, vendasB2C: 0,
    rbt12: null, pgdasFaturamento: 0, folha: 0, proLabore: 0, temFolha: false,
    comercioCategorias: { cesta: 0, reduzido60: 0, padrao: 0 }, cnaeDetectado: null, ufDetectada: null, anexoDetectado: null,
    ncmMap: {},
  };
  arquivos.forEach(f => {
    if (f.status === 'erro' || f.status === 'rejeitado') return;
    if (f.tipo === 'nfce_saida' || f.tipo === 'nfe_saida') {
      const v = f.dados.vNF || 0;
      agg.faturamentoSaida += v;
      if (f.dados.isB2B) agg.vendasB2B += v; else agg.vendasB2C += v;
      if (f.dados.porCategoria) {
        agg.comercioCategorias.cesta += f.dados.porCategoria.cesta || 0;
        agg.comercioCategorias.reduzido60 += f.dados.porCategoria.reduzido60 || 0;
        agg.comercioCategorias.padrao += f.dados.porCategoria.padrao || 0;
      }
      if (f.dados.ufEmit && !agg.ufDetectada) agg.ufDetectada = f.dados.ufEmit;
      if (f.dados.itensNCM) {
        f.dados.itensNCM.forEach(item => {
          const key = item.ncm || '(sem NCM)';
          if (!agg.ncmMap[key]) agg.ncmMap[key] = { ncm: key, descricao: item.descricao || null, categoria: item.categoria, valorTotal: 0, ocorrencias: 0 };
          agg.ncmMap[key].valorTotal += item.vProd || 0;
          agg.ncmMap[key].ocorrencias += 1;
          if (!agg.ncmMap[key].descricao && item.descricao) agg.ncmMap[key].descricao = item.descricao;
        });
      }
    } else if (f.tipo === 'nfe_entrada') {
      const v = f.dados.vNF || 0;
      agg.comprasEntrada += v;
      if (f.dados.credito) agg.comprasComCredito += v;
    } else if (f.tipo === 'pgdas') {
      if (f.dados.rbt12) agg.rbt12 = f.dados.rbt12;
      if (f.dados.faturamento) agg.pgdasFaturamento += f.dados.faturamento;
      if (f.dados.cnae && !agg.cnaeDetectado) agg.cnaeDetectado = f.dados.cnae;
      if (f.anexoDetectado && !agg.anexoDetectado) agg.anexoDetectado = f.anexoDetectado;
    } else if (f.tipo === 'folha') {
      if (f.dados.folha) { agg.folha += f.dados.folha; agg.temFolha = true; }
      if (f.dados.proLabore) { agg.proLabore += f.dados.proLabore; agg.temFolha = true; }
      if (f.dados.cnae && !agg.cnaeDetectado) agg.cnaeDetectado = f.dados.cnae;
    }
  });
  if (agg.faturamentoSaida === 0 && agg.pgdasFaturamento > 0) agg.faturamentoSaida = agg.pgdasFaturamento;
  return agg;
}

// Agrupa os arquivos processados por competência (YYYY-MM) identificada, retornando até as 6 mais recentes.
function aggregateHistorico(arquivos) {
  const byMonth = {};
  arquivos.forEach(f => {
    if (f.status === 'erro' || f.status === 'rejeitado' || !f.competencia) return;
    if (!byMonth[f.competencia]) byMonth[f.competencia] = { faturamento: 0, comprasRegimeNormal: 0, folha: 0 };
    if (f.tipo === 'nfce_saida' || f.tipo === 'nfe_saida') {
      byMonth[f.competencia].faturamento += f.dados.vNF || 0;
    } else if (f.tipo === 'nfe_entrada' && f.dados.credito) {
      byMonth[f.competencia].comprasRegimeNormal += f.dados.vNF || 0;
    } else if (f.tipo === 'folha') {
      byMonth[f.competencia].folha += (f.dados.folha || 0) + (f.dados.proLabore || 0);
    }
  });
  const competencias = Object.keys(byMonth).sort().slice(-6);
  return { competencias, porMes: competencias.map(k => byMonth[k]) };
}

function HistoricoTable({ d, onChangeMes, printMode }) {
  const linhas = useMemo(() => d.historico.map(mes => computeMesRegimes(d, mes)), [d]);
  const totais = useMemo(() => {
    const acc = { faturamento: 0, compras: 0, folha: 0, tradicional: 0, hibrido: 0, presumido: 0 };
    d.historico.forEach((mes, i) => {
      acc.faturamento += mes.faturamento; acc.compras += mes.comprasRegimeNormal; acc.folha += mes.folha;
      acc.tradicional += linhas[i].tradicional; acc.hibrido += linhas[i].hibrido; acc.presumido += linhas[i].presumido;
    });
    return acc;
  }, [d, linhas]);
  const totaisRegimes = { tradicional: totais.tradicional, hibrido: totais.hibrido, presumido: totais.presumido };
  const keys = ['tradicional', 'hibrido', 'presumido'];
  let melhorTotal = keys[0], piorTotal = keys[0];
  keys.forEach(k => { if (totaisRegimes[k] < totaisRegimes[melhorTotal]) melhorTotal = k; if (totaisRegimes[k] > totaisRegimes[piorTotal]) piorTotal = k; });
  const economiaTotal = totaisRegimes[piorTotal] - totaisRegimes[melhorTotal];

                  <td className={cellBase} style={{ borderBottom: '1px solid ' + (printMode ? '#EEF1F0' : 'var(--line-soft)'), color: 'var(--emerald)' }}>
                    {fmtBRL2(r.economia)}
                  </td>
                </tr>
              );

          <tfoot>
            <tr style={{ background: printMode ? '#E4F4EC' : 'var(--emerald-tint)' }}>

              <td className={cellBase + ' font-semibold'}>{fmtBRL2(totais.faturamento)}</td>
              <td className={cellBase + ' font-semibold'}>{fmtBRL2(totais.compras)}</td>
              <td className={cellBase + ' font-semibold'}>{fmtBRL2(totais.folha)}</td>

            <tr>
              <td className={printMode ? 'py-1.5 px-2 italic' : 'py-2 px-2.5 text-[12.5px] italic'} style={{ color: printMode ? '#5A6B70' : 'var(--ink-soft)' }}>Projeção proporcional (12 meses)</td>

              <td className={cellBase} style={{ color: printMode ? '#5A6B70' : 'var(--ink-soft)' }}>{fmtBRL2(totais.folha * 2)}</td>
              <td className={cellBase} style={{ color: printMode ? '#5A6B70' : 'var(--ink-soft)' }}>{fmtBRL2(totais.tradicional * 2)}</td>
              <td className={cellBase} style={{ color: printMode ? '#5A6B70' : 'var(--ink-soft)' }}>{fmtBRL2(totais.hibrido * 2)}</td>
              <td className={cellBase} style={{ color: printMode ? '#5A6B70' : 'var(--ink-soft)' }}>{fmtBRL2(totais.presumido * 2)}</td>
              <td className={cellBase} style={{ color: printMode ? '#5A6B70' : 'var(--ink-soft)' }}>{fmtBRL2(economiaTotal * 2)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      {!printMode && (
        <p className="text-[11px] mt-3" style={{ color: 'var(--ink-soft)' }}>
          Regime mais vantajoso no período: <strong style={{ color: 'var(--emerald)' }}>{labelRegime[melhorTotal]}</strong> — economia total de {fmtBRL2(economiaTotal)} nos 6 meses,
          equivalente a {fmtBRL2(economiaTotal * 2)} na projeção proporcional de 12 meses. A alíquota efetiva do Simples Nacional e a alíquota de CBS ponderada usadas
          no cálculo mensal seguem o RBT12 e os benefícios fiscais atualmente configurados no simulador.
        </p>
      )}
    </div>
  );
}

/* ============================= CLIENTES SALVOS (BANCO DE DADOS) ============================= */
function formatDataHora(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return '—'; }
}

function ClientesPanel({ db, dbStatus, d, onLoadClient }) {
  const [clientes, setClientes] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [salvando, setSalvando] = useState(false);
  const [mensagem, setMensagem] = useState(null);

  useEffect(() => {
    if (!db) { setCarregando(false); return; }
    const unsub = db.collection('clientes').orderBy('atualizadoEm', 'desc').limit(50).onSnapshot(
      (snap) => {
        setClientes(snap.docs.map(doc => ({ id: doc.id, ...(doc.data() || {}) })));
        setCarregando(false);
      },
      (err) => { setCarregando(false); setMensagem({ tipo: 'erro', texto: 'Não foi possível carregar a lista de clientes salvos.' }); }
    );
    return () => unsub();
  }, [db]);

  const salvarClienteAtual = async () => {
    if (!db) return;
    setSalvando(true); setMensagem(null);
    const cnpjDigits = d.cnpj ? d.cnpj.replace(/\D/g, '') : '';
    const payload = { ...d, atualizadoEm: Date.now() };
    try {
      if (cnpjDigits && cnpjDigits.length === 14) {
        await db.doc(`clientes/${cnpjDigits}`).set(payload);
      } else {
        await db.collection('clientes').add(payload);
      }
      setMensagem({ tipo: 'ok', texto: 'Cliente salvo com sucesso no banco de dados.' });
    } catch (e) {
      setMensagem({ tipo: 'erro', texto: 'Falha ao salvar: ' + (e && e.message ? e.message : 'erro desconhecido') });
    }
    setSalvando(false);
  };

  const carregarCliente = (cliente) => {
    const { id, atualizadoEm, ...dados } = cliente;
    onLoadClient({ ...BLANK_STATE(dados.setor || 'comercio'), ...dados });
    setMensagem({ tipo: 'ok', texto: `Cliente "${dados.razaoSocial || id}" carregado.` });
  };

  const excluirCliente = async (cliente) => {
    if (!db) return;
    if (!window.confirm(`Excluir permanentemente o cliente "${cliente.razaoSocial || cliente.id}" do banco de dados?`)) return;
    try {
      await db.doc(`clientes/${cliente.id}`).delete();
    } catch (e) {
      setMensagem({ tipo: 'erro', texto: 'Falha ao excluir: ' + (e && e.message ? e.message : 'erro desconhecido') });
    }
  };

  return (
    <div className="card p-5 mb-6">
      <div className="flex items-center justify-between mb-1">
        <h2 className="font-display text-[17px] font-semibold flex items-center gap-2">
          <IconDatabase className="w-5 h-5" style={{ color: 'var(--petroleo)' }} strokeWidth={1.8} />
          Clientes Salvos (Banco de Dados)
        </h2>
        <button onClick={salvarClienteAtual} disabled={!db || salvando}
          className="flex items-center gap-1.5 text-[12.5px] px-3 py-2 rounded-lg font-medium shrink-0"
          style={{ background: db ? 'var(--petroleo)' : 'var(--line-soft)', color: db ? '#fff' : 'var(--ink-soft)', opacity: salvando ? 0.7 : 1, cursor: db ? 'pointer' : 'not-allowed' }}>
          <IconDatabase className="w-3.5 h-3.5" strokeWidth={2} /> {salvando ? 'Salvando...' : 'Salvar / Atualizar Cliente Atual'}
        </button>
      </div>
      <p className="text-[13px] mb-3" style={{ color: 'var(--ink-soft)' }}>
        Grava o cliente em análise (dados cadastrais, simulação, benefícios e demonstrativo de 6 meses) em um banco
        de dados persistente, para consultar ou retomar depois. Os registros ficam disponíveis para quem acessar
        este artefato dentro da sua organização.
      </p>

      {!db && (
        <p className="text-[12px] mb-3" style={{ color: 'var(--amber)' }}>
          {dbStatus === 'checking' ? 'Conectando ao banco de dados...' : 'Banco de dados não disponível nesta visualização.'}
        </p>
      )}
      {mensagem && (
        <p className="text-[12px] mb-3" style={{ color: mensagem.tipo === 'ok' ? 'var(--emerald)' : 'var(--rose)' }}>{mensagem.texto}</p>
      )}

      {db && (
        carregando ? (
          <p className="text-[12.5px]" style={{ color: 'var(--ink-soft)' }}>Carregando clientes salvos...</p>
        ) : clientes.length === 0 ? (
          <p className="text-[12.5px]" style={{ color: 'var(--ink-soft)' }}>Nenhum cliente salvo ainda.</p>
        ) : (
          <div className="flex flex-col gap-1.5">
            {clientes.map(c => (
              <div key={c.id} className="flex items-center justify-between gap-3 px-3 py-2.5 rounded-lg" style={{ background: 'var(--paper)' }}>
                <div className="min-w-0">
                  <p className="text-[13px] font-medium truncate">{c.razaoSocial || '(sem razão social)'}</p>
                  <p className="text-[11.5px] font-mono" style={{ color: 'var(--ink-soft)' }}>
                    CNPJ {c.cnpj || '—'} · {c.setor === 'comercio' ? 'Comércio' : 'Serviços'} · atualizado em {formatDataHora(c.atualizadoEm)}
                  </p>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <button onClick={() => carregarCliente(c)} className="p-1.5 rounded-md" title="Carregar este cliente"
                    style={{ background: 'var(--petroleo-tint)', color: 'var(--petroleo)' }}>
                    <IconRefresh className="w-3.5 h-3.5" strokeWidth={2} />
                  </button>
                  <button onClick={() => excluirCliente(c)} className="p-1.5 rounded-md" title="Excluir"
                    style={{ background: 'var(--rose-tint)', color: 'var(--rose)' }}>
                    <IconTrash className="w-3.5 h-3.5" strokeWidth={2} />
                  </button>
                </div>
              </div>
            ))}
          </div>
        )
      )}
    </div>
  );
}

        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-[13px] font-medium truncate">{f.name}</span>

function UploadModule({ setor, d, onApply, onLoadExample }) {
  const [arquivos, setArquivos] = useState([]);
  const [processando, setProcessando] = useState(false);
  const [progresso, setProgresso] = useState({ atual: 0, total: 0 });
  const [dragActive, setDragActive] = useState(false);
  const [aba, setAba] = useState('validos');
  const inputRef = useRef(null);
  const skipNextAggRef = useRef(false);

  const agg = useMemo(() => aggregateFiles(arquivos), [arquivos]);
  const hasResults = arquivos.some(f => f.status !== 'erro' && f.status !== 'rejeitado');
  const validos = arquivos.filter(f => f.status !== 'rejeitado');
  const rejeitados = arquivos.filter(f => f.status === 'rejeitado');

  const handleFiles = useCallback(async (fileList) => {
    const files = Array.from(fileList).filter(f => /\.(xml|pdf|txt)$/i.test(f.name));
    if (!files.length) return;
    setProcessando(true);
    setProgresso({ atual: 0, total: files.length });

    // Etapa 1 — leitura bruta de cada arquivo (com o mesmo ritmo visual de antes).
    const raws = [];
    for (let i = 0; i < files.length; i++) {
      await new Promise(res => setTimeout(res, 220 + Math.random() * 260));
      raws.push(await parseFileRaw(files[i]));
      setProgresso({ atual: i + 1, total: files.length });
    }

    // Etapa 2 — define (ou confirma) o CNPJ mestre da empresa em análise.
    let master = d.cnpjMestreLocked && d.cnpj ? d.cnpj.replace(/\D/g, '') : (d.cnpj ? d.cnpj.replace(/\D/g, '') : null);
    if (master && master.length !== 14) master = null;
    const masterPatch = {};
    let masterSourceId = null;
    if (!master) {
      const cartao = raws.find(r => r.tipo === 'cartao_cnpj' && r.ownCNPJ);
      const pgdas = raws.find(r => r.tipo === 'pgdas' && r.ownCNPJ);
      const xml = raws.find(r => r.ext === 'xml' && r.ownCNPJ);
      const escolhido = cartao || pgdas || xml;
      if (escolhido) {
        master = escolhido.ownCNPJ;
        masterSourceId = escolhido.id;
        masterPatch.cnpj = formatCNPJDisplay(master);
        masterPatch.cnpjMestreLocked = true;
        if (escolhido.razaoSocialDetectada) masterPatch.razaoSocial = escolhido.razaoSocialDetectada;
        if (escolhido.municipioUFDetectado) masterPatch.municipioUF = escolhido.municipioUFDetectado;
        if (escolhido.cnaeDetectado) masterPatch.beneficios = { servicos: { cnae: escolhido.cnaeDetectado, categoria: classifyCNAE(escolhido.cnaeDetectado) } };
      }
    } else if (!d.cnpjMestreLocked) {
      masterPatch.cnpjMestreLocked = true;
    }

    // Etapa 3 — trava de integridade: valida/rejeita cada arquivo contra o CNPJ mestre.
    const finalizados = raws.map(r => finalizeFile(r, master, r.id === masterSourceId));
    setArquivos(prev => [...prev, ...finalizados]);
    if (Object.keys(masterPatch).length) onApply(masterPatch);
    setProcessando(false);
  }, [d.cnpj, d.cnpjMestreLocked]);

  useEffect(() => {
    if (skipNextAggRef.current) { skipNextAggRef.current = false; return; }
    if (!arquivos.length) return;
    const patch = {};
    if (agg.faturamentoSaida > 0) patch.faturamentoMensal = Math.round(agg.faturamentoSaida);
    if (agg.comprasEntrada > 0) {
      patch.comprasMensais = Math.round(agg.comprasEntrada);
      patch.pctFornecedorRegimeNormal = Math.round((agg.comprasComCredito / agg.comprasEntrada) * 100);
    }
    if (agg.vendasB2B + agg.vendasB2C > 0) patch.pctB2B = Math.round((agg.vendasB2B / (agg.vendasB2B + agg.vendasB2C)) * 100);
    if (agg.rbt12) patch.rbt12 = Math.round(agg.rbt12);
    if (agg.temFolha) {
      if (agg.folha) patch.folhaMensal = Math.round(agg.folha);
      if (agg.proLabore) patch.proLabore = Math.round(agg.proLabore);
    }
    const totalCat = agg.comercioCategorias.cesta + agg.comercioCategorias.reduzido60 + agg.comercioCategorias.padrao;
    if (setor === 'comercio' && totalCat > 0) {
      patch.beneficios = { comercio: {
        cestaPct: Math.round((agg.comercioCategorias.cesta / totalCat) * 100),
        reduzido60Pct: Math.round((agg.comercioCategorias.reduzido60 / totalCat) * 100),
      } };
    }
    if (setor === 'servicos' && agg.cnaeDetectado) {
      patch.beneficios = { servicos: { cnae: agg.cnaeDetectado, categoria: classifyCNAE(agg.cnaeDetectado) } };
    }
    if (agg.ufDetectada) {
      patch.uf = agg.ufDetectada;
      if (setor !== 'servicos' && agg.ufDetectada === 'AM') patch.aliquotaEstMun = 20;
    }
    if (agg.anexoDetectado) {
      patch.anexoDetectadoPGDAS = agg.anexoDetectado.anexo;
      patch.setor = agg.anexoDetectado.setor;
      patch.anexoServicosForcado = agg.anexoDetectado.setor === 'servicos' ? agg.anexoDetectado.anexo : null;
    }
    const ncmList = Object.values(agg.ncmMap).sort((a, b) => b.valorTotal - a.valorTotal);
    if (ncmList.length > 0) patch.ncmDetalhado = ncmList;
    const histAgg = aggregateHistorico(arquivos);
    if (histAgg.competencias.length > 0) patch.historicoUpdate = histAgg;
    if (Object.keys(patch).length) onApply(patch);
    // eslint-disable-next-line
  }, [arquivos]);

  const toggleDirecao = (id) => {
    setArquivos(prev => prev.map(f => {
      if (f.id !== id) return f;
      if (f.tipo === 'nfe_saida') return { ...f, tipo: 'nfe_entrada', badge: 'XML Entrada lido (reclassificado manualmente)', dados: { vNF: f.dados.vNF, credito: false } };
      if (f.tipo === 'nfe_entrada') return { ...f, tipo: 'nfe_saida', badge: 'XML Saída lido (reclassificado manualmente)', dados: { vNF: f.dados.vNF, isB2B: false } };
      return f;
    }));
  };
  const removeFile = (id) => setArquivos(prev => prev.filter(f => f.id !== id));

  const handleExample = (key) => {
    skipNextAggRef.current = true;
    const mocks = { comercio: MOCK_ARQUIVOS_COMERCIO, industria: MOCK_ARQUIVOS_INDUSTRIA, servicos: MOCK_ARQUIVOS_SERVICOS };
    setArquivos(mocks[key]);
    onLoadExample(key);
  };

  return (
    <div className="card p-5 mb-6">
      <div className="flex items-center justify-between mb-1">
        <h2 className="font-display text-[17px] font-semibold flex items-center gap-2">
          <IconUpload className="w-5 h-5" style={{ color: 'var(--petroleo)' }} strokeWidth={1.9} />
          Upload de documentos fiscais e contábeis
        </h2>
      </div>
      <p className="text-[13px] mb-4" style={{ color: 'var(--ink-soft)' }}>
        Envie o Cartão CNPJ, XMLs de NF-e/NFC-e (saídas e entradas), extrato do PGDAS-D e relatório de folha de
        pagamento. O primeiro documento define o CNPJ mestre da empresa em análise, e todo arquivo enviado depois
        passa por validação cruzada contra esse CNPJ antes de compor o cálculo.
      </p>

      <div className="grid grid-cols-1 sm:grid-cols-[1fr_240px] gap-3 mb-4">
        <div
          className={`dropzone p-6 flex flex-col items-center justify-center text-center gap-2 cursor-pointer ${dragActive ? 'drag-active' : ''}`}
          onClick={() => inputRef.current && inputRef.current.click()}
          onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
          onDragLeave={() => setDragActive(false)}
          onDrop={(e) => { e.preventDefault(); setDragActive(false); handleFiles(e.dataTransfer.files); }}
        >
          <IconUpload className="w-7 h-7" style={{ color: 'var(--petroleo)' }} strokeWidth={1.6} />
          <p className="text-[13.5px] font-medium">Arraste os arquivos aqui ou clique para selecionar</p>
          <p className="text-[11.5px]" style={{ color: 'var(--ink-soft)' }}>.xml (NF-e/NFC-e) · .pdf / .txt (Cartão CNPJ, PGDAS-D, folha, eSocial, DCTFWeb)</p>
          <input ref={inputRef} type="file" multiple accept=".xml,.pdf,.txt" className="hidden"
            onChange={(e) => { handleFiles(e.target.files); e.target.value = ''; }} />
        </div>
        {d.cnpjMestreLocked ? (
          <div className="rounded-lg p-3 text-[11.5px]" style={{ background: 'var(--emerald-tint)', color: 'var(--emerald)' }}>
            <p className="font-semibold mb-1">CNPJ mestre definido</p>
            <p className="font-mono">{d.cnpj}</p>
            <p className="mt-1">Todo arquivo enviado é validado automaticamente contra este CNPJ.</p>
          </div>
        ) : (
          <div>
            <label className="field-label">CNPJ do contribuinte (opcional)</label>
            <input type="text" placeholder="00.000.000/0000-00" value={d.cnpj}
              onChange={(e) => onApply(aplicarCnpjDigitado(e.target.value))} />
            <p className="text-[11px] mt-1" style={{ color: 'var(--ink-soft)' }}>Se deixado em branco, será definido automaticamente pelo primeiro Cartão CNPJ, PGDAS-D ou XML enviado.</p>
          </div>
        )}
      </div>

      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={() => handleExample('comercio')}
          className="flex items-center gap-1.5 text-[12.5px] px-3 py-2 rounded-lg font-medium" style={{ background: 'var(--violet-tint)', color: 'var(--violet)' }}>
          <IconSparkle className="w-3.5 h-3.5" strokeWidth={2} /> Carregar Exemplo Real: Comércio Varejista
        </button>
        <button onClick={() => handleExample('industria')}
          className="flex items-center gap-1.5 text-[12.5px] px-3 py-2 rounded-lg font-medium" style={{ background: 'var(--violet-tint)', color: 'var(--violet)' }}>
          <IconSparkle className="w-3.5 h-3.5" strokeWidth={2} /> Carregar Exemplo Real: Indústria
        </button>
        <button onClick={() => handleExample('servicos')}
          className="flex items-center gap-1.5 text-[12.5px] px-3 py-2 rounded-lg font-medium" style={{ background: 'var(--violet-tint)', color: 'var(--violet)' }}>
          <IconSparkle className="w-3.5 h-3.5" strokeWidth={2} /> Carregar Exemplo Real: Empresa de Serviços
        </button>
      </div>

      {processando && (
        <div className="mb-4">
          <p className="text-[12.5px] flex items-center gap-2 mb-1.5" style={{ color: 'var(--petroleo)' }}>
            <IconLoader className="w-3.5 h-3.5 spin" strokeWidth={2.4} /> Processando documentos fiscais... ({progresso.atual}/{progresso.total})
          </p>
          <div className="progress-track"><div className="progress-fill" style={{ width: `${(progresso.atual / Math.max(1, progresso.total)) * 100}%` }} /></div>
        </div>
      )}

      {arquivos.length > 0 && (
        <div className="mb-4">
          <div className="flex gap-2 mb-2">
            <button onClick={() => setAba('validos')}
              className="text-[12px] font-medium px-3 py-1.5 rounded-full"
              style={aba === 'validos' ? { background: 'var(--emerald)', color: '#fff' } : { background: 'var(--paper)', color: 'var(--ink-soft)' }}>
              Documentos Válidos ({validos.length})
            </button>
            <button onClick={() => setAba('rejeitados')}
              className="text-[12px] font-medium px-3 py-1.5 rounded-full"
              style={aba === 'rejeitados' ? { background: 'var(--rose)', color: '#fff' } : { background: 'var(--paper)', color: 'var(--ink-soft)' }}>
              Documentos Rejeitados por Divergência ({rejeitados.length})
            </button>
          </div>
          <div className="flex flex-col gap-1.5">

              {agg.vendasB2B + agg.vendasB2C > 0

                : '—'}

      )}

      <div className="flex items-start gap-2 p-3 rounded-lg" style={{ background: 'var(--paper)', border: '1px solid var(--line-soft)' }}>

        <p className="text-[11.5px]" style={{ color: 'var(--ink-soft)' }}>

          externos, em conformidade com a LGPD. Os campos extraídos permanecem totalmente editáveis para ajuste fino.
        </p>
      </div>
    </div>
  );
}

/* ============================= MEMORIAL DESCRITIVO DOS CÁLCULOS (Anexo A) ============================= */
function LinhaPartilha({ label, pct, base, destaque }) {
  if (pct === undefined || pct === null) return null;
  const valor = base * (pct / 100);
  return (
    <tr>
      <td className="py-1 px-2" style={{ borderBottom: '1px solid #EEF1F0', fontWeight: destaque ? 600 : 400 }}>{label}</td>
      <td className="py-1 px-2 text-right font-mono" style={{ borderBottom: '1px solid #EEF1F0' }}>{pct.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%</td>
      <td className="py-1 px-2 text-right font-mono" style={{ borderBottom: '1px solid #EEF1F0', fontWeight: destaque ? 600 : 400 }}>{fmtBRL2(valor)}</td>
    </tr>
  );
}

function MemorialCalculo({ d, calc, onClose }) {
  const setorLabel = d.setor === 'comercio' ? 'comércio varejista' : d.setor === 'industria' ? 'atividade industrial' : 'prestação de serviços';
  const faixa = calc.faixa;
  const p = faixa.partilha;
  const dasTabela = d.faturamentoMensal * calc.aliqEfetiva;
  const reducaoPct = faixa.percCBS / 100;
  const parcelaCofinsPis = dasTabela * reducaoPct;
  const dasHibridoBase = dasTabela - parcelaCofinsPis;
  const cbsLiquidoHibrido = Math.max(0, calc.cbsDebito - calc.cbsCredito);
  const cppSeparado = calc.cppNoDAS ? 0 : CPP_ANEXO_IV_ALIQ * (d.folhaMensal + d.proLabore);
  const cppSeparadoFolha = calc.cppNoDAS ? 0 : CPP_ANEXO_IV_ALIQ * d.folhaMensal;
  const cppSeparadoProLabore = calc.cppNoDAS ? 0 : CPP_ANEXO_IV_ALIQ * d.proLabore;
  const totalTradicional = dasTabela + cppSeparado;
  const totalHibrido = dasHibridoBase + cbsLiquidoHibrido + cppSeparado;

  const baseIRPJ = PRESUNCAO_IRPJ[d.setor] * d.faturamentoMensal;
  const adicionalIRPJ = Math.max(0, baseIRPJ - 20000) * 0.10;
  const irpj = baseIRPJ * 0.15 + adicionalIRPJ;
  const baseCSLL = PRESUNCAO_CSLL[d.setor] * d.faturamentoMensal;
  const csll = baseCSLL * 0.09;
  const cppFolha = CPP_FOLHA_ALIQ * d.folhaMensal;
  const cppProLabore = CPP_PROLABORE_ALIQ * d.proLabore;
  const cppPresumido = cppFolha + cppProLabore;
  let icmsDebito = 0, icmsCredito = 0, icmsLiquido = 0, iss = 0;
  if (d.setor !== 'servicos') {
    icmsDebito = (d.aliquotaEstMun / 100) * d.faturamentoMensal;
    icmsCredito = (d.aliquotaEstMun / 100) * d.comprasMensais;
    icmsLiquido = Math.max(0, icmsDebito - icmsCredito);
  } else {
    iss = (d.aliquotaEstMun / 100) * d.faturamentoMensal;
  }
  const cbsLiquidoPresumido = Math.max(0, calc.cbsDebito - calc.cbsCredito);
  const totalPresumido = irpj + csll + cppPresumido + icmsLiquido + iss + cbsLiquidoPresumido;

  const historicoCalc = useMemo(() => d.historico.map(mes => computeMesRegimes(d, mes)), [d]);

  const thBase = { padding: '4px 8px', textAlign: 'right', borderBottom: '1px solid #D3DCDA', background: '#EEF3F1' };

    <div className="fixed inset-0 z-50 overflow-y-auto" style={{ background: 'rgba(10,18,20,0.55)' }}>
      <div className="no-print sticky top-0 flex justify-between items-center px-5 py-3" style={{ background: 'var(--petroleo-dark)' }}>
        <p className="text-white text-sm font-medium">Memorial Descritivo dos Cálculos — pré-visualização</p>
        <div className="flex gap-2">
          <button onClick={() => window.print()} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium" style={{ background: 'var(--emerald)', color: '#fff' }}>
            <IconPrinter className="w-4 h-4" strokeWidth={2} /> Imprimir / Salvar PDF
          </button>
          <button onClick={onClose} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium" style={{ background: 'rgba(255,255,255,0.12)', color: '#fff' }}>
            <IconX className="w-4 h-4" strokeWidth={2} /> Fechar
          </button>
        </div>
      </div>

      <div id="memorial-print" className="mx-auto my-6 px-8 py-8" style={{ background: '#fff', color: '#1C2A30', fontFamily: "'IBM Plex Sans', sans-serif", maxWidth: '1100px' }}>
        <div className="flex justify-between items-start pb-3" style={{ borderBottom: '2px solid #0C4A5C' }}>
          <div>
            <p className="font-display text-[17px] font-semibold" style={{ color: '#0C4A5C' }}>G&amp;M Contabilidade LTDA</p>
            <p className="text-[11px]" style={{ color: '#5A6B70' }}>CNPJ 13.938.626/0001-29 · Germano Cunha Miranda · CRC-AM-010043-O/9</p>
          </div>
          <div className="text-right">
            <p className="text-[10px]" style={{ color: '#5A6B70' }}>Anexo A do Parecer Técnico</p>

        </p>

        {/* ============ A) SIMPLES NACIONAL TRADICIONAL ============ */}

            <tbody>

                <td className="py-1 px-2 font-semibold">Total do DAS (tabela)</td>

            </tbody>
          </table>
          <p className="text-[12px] text-right"><strong>Total mensal — Simples Tradicional: {fmtBRL2(totalTradicional)} &nbsp;|&nbsp; Alíquota efetiva sobre faturamento: {fmtPct(d.faturamentoMensal > 0 ? totalTradicional / d.faturamentoMensal : 0)}</strong></p>
        </section>

        {/* ============ B) SIMPLES NACIONAL HÍBRIDO ============ */}
        <section className="mb-5">
          <h2 className="font-display text-[14px] font-semibold mb-1.5 px-2 py-1" style={{ color: '#fff', background: '#0C4A5C' }}>B) Simples Nacional Híbrido</h2>

            <tbody>
              <LinhaPartilha label="IRPJ" pct={p.irpj} base={dasTabela} />

          </p>

          <table className="w-full text-[11px] border-collapse mb-2">
