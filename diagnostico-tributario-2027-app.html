/* ============================= ANEXO — NCMs PARA CONFERÊNCIA (Anexo B) ============================= */
function AnexoNCM({ d, onClose }) {
  const categoriaLabel = { cesta: 'Cesta Básica (alíquota zero)', reduzido60: 'Redução 60% (3,52%)', padrao: 'Padrão (8,8%)' };
  const categoriaCor = { cesta: '#0E8F62', reduzido60: '#5B4B9E', padrao: '#5A6B70' };

  const itensAnotados = useMemo(() => {
    return d.ncmDetalhado.map(item => {
      const sugestao = sugerirNCM(item.descricao);
      const temBeneficio = item.categoria === 'cesta' || item.categoria === 'reduzido60';
      // Suspeito: tem benefício fiscal E a descrição bate com um termo do dicionário de ferragem/moto —
      // ou seja, o produto claramente não é alimento/medicamento/insumo agropecuário, mas foi classificado como tal.
      const suspeito = temBeneficio && !!sugestao;
      const prioridade = suspeito ? 2 : temBeneficio ? 1 : 0;
      return { ...item, sugestao, temBeneficio, suspeito, prioridade };
    }).sort((a, b) => b.prioridade - a.prioridade || b.valorTotal - a.valorTotal);
  }, [d.ncmDetalhado]);

  const totalGeral = d.ncmDetalhado.reduce((s, it) => s + it.valorTotal, 0);
  const suspeitos = itensAnotados.filter(it => it.suspeito);
  const beneficiados = itensAnotados.filter(it => it.temBeneficio);
  const totalSuspeitos = suspeitos.reduce((s, it) => s + it.valorTotal, 0);
  const totalBeneficiados = beneficiados.reduce((s, it) => s + it.valorTotal, 0);

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto" style={{ background: 'rgba(10,18,20,0.55)' }}>
      <div className="no-print sticky top-0 flex justify-between items-center px-5 py-3" style={{ background: 'var(--petroleo-dark)' }}>
        <p className="text-white text-sm font-medium">Anexo — Lista de NCMs para Conferência — pré-visualização</p>
        <div className="flex gap-2">
          <button onClick={() => window.print()} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium" style={{ background: 'var(--emerald)', color: '#fff' }}>
            <IconPrinter className="w-4 h-4" strokeWidth={2} /> Imprimir / Salvar PDF
          </button>
          <button onClick={onClose} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium" style={{ background: 'rgba(255,255,255,0.12)', color: '#fff' }}>
            <IconX className="w-4 h-4" strokeWidth={2} /> Fechar
          </button>
        </div>
      </div>

      <div id="ncm-print" className="mx-auto my-6 px-8 py-8" style={{ background: '#fff', color: '#1C2A30', fontFamily: "'IBM Plex Sans', sans-serif", maxWidth: '1200px' }}>
        <div className="flex justify-between items-start pb-3" style={{ borderBottom: '2px solid #0C4A5C' }}>
          <div>
            <p className="font-display text-[17px] font-semibold" style={{ color: '#0C4A5C' }}>G&amp;M Contabilidade LTDA</p>
            <p className="text-[11px]" style={{ color: '#5A6B70' }}>CNPJ 13.938.626/0001-29 · Germano Cunha Miranda · CRC-AM-010043-O/9</p>
          </div>
          <div className="text-right">
            <p className="text-[10px]" style={{ color: '#5A6B70' }}>Anexo B do Parecer Técnico</p>
            <p className="font-mono text-[16px] font-semibold" style={{ color: '#0C4A5C' }}>Exercício 2027</p>
          </div>
        </div>

        <h1 className="font-display text-[19px] font-semibold text-center mt-4 mb-1">Lista de NCMs para Conferência</h1>
        <p className="text-center text-[12px] mb-4" style={{ color: '#5A6B70' }}>
          {d.razaoSocial || '—'} · CNPJ {d.cnpj || '—'} · NCMs identificados nos XMLs de saída processados
        </p>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
          <div className="rounded-lg p-3" style={{ background: '#F8E9E9', border: '1px solid #D9AFAF' }}>
            <p className="text-[10.5px]" style={{ color: '#A23B3B' }}>Itens com possível erro de classificação</p>
            <p className="font-mono text-[15px] font-semibold" style={{ color: '#A23B3B' }}>{suspeitos.length} item(ns) · {fmtBRL2(totalSuspeitos)}</p>
          </div>
          <div className="rounded-lg p-3" style={{ background: '#ECE9F7', border: '1px solid #C9C0E8' }}>
            <p className="text-[10.5px]" style={{ color: '#5B4B9E' }}>Total classificado com benefício fiscal</p>
            <p className="font-mono text-[15px] font-semibold" style={{ color: '#5B4B9E' }}>{beneficiados.length} item(ns) · {fmtBRL2(totalBeneficiados)}</p>
          </div>
          <div className="rounded-lg p-3" style={{ background: '#EEF3F1', border: '1px solid #C9D6D2' }}>
            <p className="text-[10.5px]" style={{ color: '#5A6B70' }}>Total geral de itens / valor</p>
            <p className="font-mono text-[15px] font-semibold">{itensAnotados.length} item(ns) · {fmtBRL2(totalGeral)}</p>
          </div>
        </div>

        <div className="p-3 rounded-lg text-[12px] leading-relaxed text-justify mb-4" style={{ background: '#FBF0DE', border: '1px solid #D7B06F' }}>
          A classificação de benefícios (Cesta Básica, redução de 60% ou alíquota padrão) exibida abaixo é <strong>gerada
          automaticamente</strong> por comparação do NCM de cada item com uma tabela de referência interna do escritório
          — não é uma consulta oficial à Receita Federal, e não é exaustiva. A coluna "Sugestão pela descrição" também é
          automática, por palavras-chave do próprio texto do produto — não substitui a classificação fiscal correta, que
          deve ser feita pelo cliente e/ou pelo contador responsável. Itens marcados com <strong style={{ color: '#A23B3B' }}>⚠ possível erro</strong> foram
          classificados com benefício fiscal apesar de a descrição do produto sugerir um item de natureza diferente
          (ex.: ferragem ou peça de motocicleta classificada como alimento) — confira estes primeiro.
        </div>

        <table className="w-full text-[10.5px] border-collapse">
          <thead>
            <tr style={{ background: '#EEF3F1' }}>
              <th className="py-1.5 px-2 text-left" style={{ borderBottom: '1px solid #D3DCDA' }}>Alerta</th>
              <th className="py-1.5 px-2 text-left" style={{ borderBottom: '1px solid #D3DCDA' }}>NCM (no XML)</th>
              <th className="py-1.5 px-2 text-left" style={{ borderBottom: '1px solid #D3DCDA' }}>Descrição do item (conforme XML do cliente)</th>
              <th className="py-1.5 px-2 text-left" style={{ borderBottom: '1px solid #D3DCDA' }}>Classificação automática</th>
              <th className="py-1.5 px-2 text-left" style={{ borderBottom: '1px solid #D3DCDA' }}>Sugestão de NCM pela descrição</th>
              <th className="py-1.5 px-2 text-right" style={{ borderBottom: '1px solid #D3DCDA' }}>Ocorrências</th>
              <th className="py-1.5 px-2 text-right" style={{ borderBottom: '1px solid #D3DCDA' }}>Valor total (R$)</th>
            </tr>
          </thead>
          <tbody>
            {itensAnotados.map((item, i) => (
              <tr key={i} style={item.suspeito ? { background: '#FBF0F0' } : {}}>
                <td className="py-1 px-2" style={{ borderBottom: '1px solid #EEF1F0' }}>
                  {item.suspeito ? <span style={{ color: '#A23B3B', fontWeight: 600 }}>⚠ possível erro</span>
                    : item.temBeneficio ? <span style={{ color: '#5B4B9E' }}>confira</span> : ''}
                </td>
                <td className="py-1 px-2 font-mono" style={{ borderBottom: '1px solid #EEF1F0' }}>{item.ncm}</td>
                <td className="py-1 px-2" style={{ borderBottom: '1px solid #EEF1F0' }}>{item.descricao || '—'}</td>
                <td className="py-1 px-2" style={{ borderBottom: '1px solid #EEF1F0', color: categoriaCor[item.categoria] }}>{categoriaLabel[item.categoria] || item.categoria}</td>
                <td className="py-1 px-2" style={{ borderBottom: '1px solid #EEF1F0' }}>
                  {item.sugestao ? <span><span className="font-mono">{item.sugestao.ncm}</span> — {item.sugestao.desc}</span> : <span style={{ color: '#5A6B70' }}>—</span>}
                </td>
                <td className="py-1 px-2 text-right font-mono" style={{ borderBottom: '1px solid #EEF1F0' }}>{item.ocorrencias}</td>
                <td className="py-1 px-2 text-right font-mono" style={{ borderBottom: '1px solid #EEF1F0' }}>{fmtBRL2(item.valorTotal)}</td>
              </tr>
            ))}
            <tr style={{ background: '#EEF3F1' }}>
              <td className="py-1.5 px-2 font-semibold" colSpan="6">Total</td>
              <td className="py-1.5 px-2 text-right font-mono font-semibold">{fmtBRL2(totalGeral)}</td>
            </tr>
          </tbody>
        </table>

        <p className="text-[10.5px] mt-4" style={{ color: '#5A6B70' }}>
          Documento gerado a partir dos itens de venda constantes nos XMLs de NF-e/NFC-e processados pelo aplicativo,
          para uso exclusivo de conferência interna pelo cliente e pelo contador responsável. Não constitui documento
          fiscal nem substitui a nota fiscal original.
        </p>
      </div>
    </div>
  );
}

/* ============================= APP ============================= */
/* ============================= CARTEIRA DE CLIENTES (localStorage) ============================= */
const LS_KEY = 'hub_tributario_clientes_2027';
const ANEXO_SEGMENTO = { I: 'Comércio', II: 'Indústria', III: 'Serviços', IV: 'Serviços', V: 'Serviços' };

function lsLoadCarteira() {
  try {
    if (typeof window === 'undefined' || !window.localStorage) return { list: [], erro: 'localStorage indisponível neste navegador/contexto.' };
    const raw = window.localStorage.getItem(LS_KEY);
    if (!raw) return { list: [], erro: null };
    const parsed = JSON.parse(raw);
    return { list: Array.isArray(parsed) ? parsed : [], erro: null };
  } catch (e) { return { list: [], erro: 'Falha ao ler o histórico local: ' + (e && e.message ? e.message : String(e)) }; }
}
function lsSaveCarteira(list) {
  try {
    if (typeof window === 'undefined' || !window.localStorage) return { ok: false, erro: 'localStorage indisponível neste navegador/contexto (comum ao abrir o arquivo direto do computador, sem servidor — use o link publicado).' };
    window.localStorage.setItem(LS_KEY, JSON.stringify(list));
    return { ok: true, erro: null };
  } catch (e) { return { ok: false, erro: 'Falha ao salvar: ' + (e && e.message ? e.message : String(e)) }; }
}
// Monta o registro persistido de um cliente a partir do estado atual (d) e do resultado do cálculo (calc).
function buildClienteRecord(d, calc) {
  const cnpjDigits = d.cnpj ? d.cnpj.replace(/\D/g, '') : '';
  const id = (cnpjDigits && cnpjDigits.length === 14) ? cnpjDigits : `novo-${Date.now()}`;
  const regimes = calc.regimes;
  const keys = ['tradicional', 'hibrido', 'presumido'];
  let pior = keys[0];
  keys.forEach(k => { if (regimes[k].anual > regimes[pior].anual) pior = k; });
  const economiaAnual = regimes[pior].anual - regimes[calc.melhor].anual;
  const parecerResumo = `Regime recomendado: ${regimes[calc.melhor].label}. Economia anual estimada: ${fmtBRL(economiaAnual)} `
    + `em relação a ${regimes[pior].label}. Enquadramento: Anexo ${calc.nomeAnexo} (LC nº 123/2006), setor ${ANEXO_SEGMENTO[calc.nomeAnexo] || d.setor}. `
    + `Análise gerada em ${new Date().toLocaleString('pt-BR')}.`;
  return {
    id,
    cnpj: d.cnpj, razaoSocial: d.razaoSocial, nomeFantasia: d.razaoSocial,
    cnae: (d.beneficios && d.beneficios.servicos) ? (d.beneficios.servicos.cnae || null) : null,
    anexo: calc.nomeAnexo, setor: d.setor, uf: d.uf, municipioUF: d.municipioUF,
    dataAnalise: Date.now(),
    historico: d.historico, historicoCompetencias: d.historicoCompetencias,
    resultados: {
      tradicional: { mensal: regimes.tradicional.mensal, anual: regimes.tradicional.anual },
      hibrido: { mensal: regimes.hibrido.mensal, anual: regimes.hibrido.anual },
      presumido: { mensal: regimes.presumido.mensal, anual: regimes.presumido.anual },
      melhor: calc.melhor, economiaAnual,
    },
    parecerResumo,
    d,
  };
}

function exemploPorSetor(setor) {
  return setor === 'industria' ? EXEMPLO_INDUSTRIA : setor === 'servicos' ? EXEMPLO_SERVICOS : EXEMPLO_COMERCIO;
}

function BLANK_STATE(setor) {
  return {
    setor, razaoSocial: '', cnpj: '', municipioUF: '', uf: 'AM', cnpjMestreLocked: false,
    faturamentoMensal: 0, rbt12: 0, comprasMensais: 0, pctFornecedorRegimeNormal: 0,
    folhaMensal: 0, proLabore: 0, aliquotaEstMun: setor === 'servicos' ? 3 : 20, pctB2B: 0,
    anexoServicosForcado: null, anexoDetectadoPGDAS: null, ncmDetalhado: [],
    beneficios: { comercio: { cestaPct: 0, reduzido60Pct: 0 }, servicos: { cnae: '', categoria: 'padrao', aliqPersonalizada: 8.8 } },
    historico: [0, 1, 2, 3, 4, 5].map(() => ({ faturamento: 0, comprasRegimeNormal: 0, folha: 0 })),
    historicoCompetencias: [null, null, null, null, null, null],
  };
}

function App() {
  const [d, setD] = useState(EXEMPLO_COMERCIO);
  const [showParecer, setShowParecer] = useState(false);
  const [showMemorial, setShowMemorial] = useState(false);
  const [showNcmAnexo, setShowNcmAnexo] = useState(false);
  const [resetCounter, setResetCounter] = useState(0);
  const [db, setDb] = useState(null);
  const [dbStatus, setDbStatus] = useState('checking');
  const [carteira, setCarteira] = useState([]);
  const [lsErro, setLsErro] = useState(null);
  const [downloadsApi, setDownloadsApi] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);
  const importInputRef = useRef(null);
  const set = (patch) => setD(prev => ({ ...prev, ...patch }));

  const showToast = useCallback((msg) => {
    setToast(msg);
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToast(null), 3400);
  }, []);

  useEffect(() => {
    let alive = true;
    if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
      window.claude.use('db').then(dbApi => {
        if (!alive) return;
        setDb(dbApi);
        setDbStatus(dbApi ? 'ready' : 'unavailable');
      }).catch(() => { if (alive) setDbStatus('unavailable'); });
      window.claude.use('downloads').then(api => { if (alive) setDownloadsApi(api); }).catch(() => {});
    } else {
      setDbStatus('unavailable');
    }
    return () => { alive = false; };
  }, []);

  // Carteira de clientes: usa o banco de dados do Claude quando disponível (não depende do localStorage do
  // navegador, então não é afetado por bloqueios de "Tracking Prevention"/cookies de terceiros dentro do
  // quadro do artefato). Só recorre ao localStorage do navegador quando o app roda fora do Claude (ex.: arquivo
  // aberto direto num VPS, sem essa capacidade disponível).
  useEffect(() => {
    if (db) {
      const unsub = db.collection('clientes').orderBy('atualizadoEm', 'desc').limit(50).onSnapshot(
        (snap) => { setCarteira(snap.docs.map(doc => ({ id: doc.id, ...(doc.data() || {}) }))); setLsErro(null); },
        (err) => { setLsErro('Falha ao carregar clientes do banco de dados do Claude: ' + (err && err.message ? err.message : String(err))); }
      );
      return () => unsub();
    }
    if (dbStatus === 'unavailable') {
      const r = lsLoadCarteira();
      setCarteira(r.list);
      setLsErro(r.erro);
    }
  }, [db, dbStatus]);

  const resetEmpresa = () => {
    if (!window.confirm('Limpar todos os dados da empresa atual e iniciar um novo cliente? Esta ação não pode ser desfeita.')) return;
    setD(prev => BLANK_STATE(prev.setor));
    setResetCounter(c => c + 1);
    setShowParecer(false);
  };

  const applyFromDocs = useCallback((patch) => {
    setD(prev => {
      const { beneficios, historicoUpdate, ...rest } = patch;
      const next = { ...prev, ...rest };
      if (beneficios) {
        next.beneficios = {
          comercio: { ...prev.beneficios.comercio, ...(beneficios.comercio || {}) },
          servicos: { ...prev.beneficios.servicos, ...(beneficios.servicos || {}) },
        };
      }
      if (historicoUpdate && historicoUpdate.competencias.length > 0) {
        const { competencias, porMes } = historicoUpdate;
        const startIdx = Math.max(0, 6 - competencias.length);
        const newHistorico = [...prev.historico];
        const newComp = [...prev.historicoCompetencias];
        competencias.forEach((c, idx) => {
          const slot = startIdx + idx;
          if (slot >= 0 && slot < 6) { newHistorico[slot] = porMes[idx]; newComp[slot] = c; }
        });
        next.historico = newHistorico;
        next.historicoCompetencias = newComp;
      }
      return next;
    });
  }, []);

  const setBeneficiosComercio = (patch) => setD(prev => ({ ...prev, beneficios: { ...prev.beneficios, comercio: { ...prev.beneficios.comercio, ...patch } } }));
  const setBeneficiosServicos = (patch) => setD(prev => ({ ...prev, beneficios: { ...prev.beneficios, servicos: { ...prev.beneficios.servicos, ...patch } } }));
  const setHistoricoMes = (idx, patch) => setD(prev => {
    const historico = prev.historico.map((m, i) => i === idx ? { ...m, ...patch } : m);
    return { ...prev, historico };
  });

  const calc = useMemo(() => computeRegimes(d), [d]);
  const regimes = calc.regimes;
  const ordenados = ['tradicional', 'hibrido', 'presumido'].slice().sort((a, b) => regimes[a].mensal - regimes[b].mensal);
  const pior = ordenados[ordenados.length - 1];
  const economiaAnual = regimes[pior].anual - regimes[calc.melhor].anual;
  const isComercio = d.setor === 'comercio';
  const isIndustria = d.setor === 'industria';
  const isServicos = d.setor === 'servicos';

  // Autosave (debounced) — grava/atualiza o cliente atual assim que o CNPJ mestre está fixado. Usa o banco do
  // Claude quando disponível; cai para o localStorage do navegador só quando roda fora do Claude.
  useEffect(() => {
    if (!d.cnpjMestreLocked || !d.cnpj) return;
    const t = setTimeout(async () => {
      const record = buildClienteRecord(d, calc);
      if (db) {
        try {
          await db.doc(`clientes/${record.id}`).set(record);
          setLsErro(null);
          showToast(`Dados da empresa ${d.razaoSocial || d.cnpj} salvos com sucesso.`);
        } catch (e) {
          showToast(`⚠ Não foi possível salvar: ${e && e.message ? e.message : String(e)}`);
        }
        return;
      }
      setCarteira(prev => {
        const idx = prev.findIndex(c => c.id === record.id);
        const next = idx >= 0 ? prev.map((c, i) => (i === idx ? record : c)) : [...prev, record];
        const resultado = lsSaveCarteira(next);
        setLsErro(resultado.ok ? null : resultado.erro);
        if (resultado.ok) {
          showToast(`Dados da empresa ${d.razaoSocial || d.cnpj} salvos com sucesso no histórico local.`);
        } else {
          showToast(`⚠ Não foi possível salvar no histórico local: ${resultado.erro}`);
        }
        return next;
      });
    }, 1200);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [d, calc, db]);

  const activeClienteId = useMemo(() => {
    const digits = d.cnpj ? d.cnpj.replace(/\D/g, '') : '';
    return carteira.some(c => c.id === digits) ? digits : '';
  }, [d.cnpj, carteira]);

  const temDadosNaoSalvos = (dd) => !dd.cnpjMestreLocked && !!(dd.razaoSocial || dd.cnpj || dd.faturamentoMensal > 0 || dd.rbt12 > 0);

  const novoCliente = () => {
    if (temDadosNaoSalvos(d) && !window.confirm('Os dados preenchidos ainda não foram salvos (o CNPJ mestre ainda não foi definido para esta empresa). Iniciar um novo cliente agora vai descartá-los. Deseja continuar?')) return;
    setD(prev => BLANK_STATE(prev.setor));
    setResetCounter(c => c + 1);
    setShowParecer(false);
  };

  const selecionarCliente = (id) => {
    if (!id) { novoCliente(); return; }
    if (temDadosNaoSalvos(d) && !window.confirm('Os dados preenchidos ainda não foram salvos. Trocar de cliente agora vai descartá-los. Deseja continuar?')) return;
    const rec = carteira.find(c => c.id === id);
    if (!rec || !rec.d) return;
    setD(rec.d);
    setResetCounter(c => c + 1);
    setShowParecer(false);
  };

  const excluirClienteAtivo = async () => {
    const rec = carteira.find(c => c.id === activeClienteId);
    if (!rec) { showToast('Nenhum cliente salvo selecionado para excluir.'); return; }
    if (!window.confirm(`Excluir permanentemente "${rec.razaoSocial || rec.cnpj}" do histórico? Esta ação não pode ser desfeita.`)) return;
    if (db) {
      try {
        await db.doc(`clientes/${rec.id}`).delete();
        novoCliente();
        showToast(`Cliente "${rec.razaoSocial || rec.cnpj}" excluído.`);
      } catch (e) {
        showToast(`⚠ Falha ao excluir: ${e && e.message ? e.message : String(e)}`);
      }
      return;
    }
    let resultado = null;
    setCarteira(prev => {
      const next = prev.filter(c => c.id !== rec.id);
      resultado = lsSaveCarteira(next);
      return next;
    });
    novoCliente();
    if (resultado && !resultado.ok) { setLsErro(resultado.erro); showToast(`⚠ Cliente removido da tela, mas houve falha ao salvar: ${resultado.erro}`); }
    else { setLsErro(null); showToast(`Cliente "${rec.razaoSocial || rec.cnpj}" excluído do histórico local.`); }
  };

  const exportarBackup = async () => {
    if (!downloadsApi) { showToast('Exportação de arquivo não disponível nesta visualização.'); return; }
    if (!carteira.length) { showToast('Nenhum cliente salvo para exportar.'); return; }
    const payload = JSON.stringify(carteira, null, 2);
    try {
      await downloadsApi.save({ filename: `hub_tributario_clientes_2027_backup_${new Date().toISOString().slice(0, 10)}.json`, data: payload });
      showToast('Backup de todos os clientes exportado com sucesso.');
    } catch (e) {
      if (e && e.code === 'declined') return;
      showToast('Não foi possível exportar o backup agora.');
    }
  };

  const importarBackup = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const parsed = JSON.parse(String(reader.result || ''));
        if (!Array.isArray(parsed)) throw new Error('formato inválido');
        const validos = parsed.filter(rec => rec && rec.id);
        if (db) {
          try {
            await Promise.all(validos.map(rec => db.doc(`clientes/${rec.id}`).set(rec)));
            setLsErro(null);
            showToast(`Backup importado: ${validos.length} cliente(s) processado(s).`);
          } catch (e) {
            showToast(`⚠ Falha ao salvar após importar: ${e && e.message ? e.message : String(e)}`);
          }
          return;
        }
        let resultado = null;
        setCarteira(prev => {
          const merged = [...prev];
          validos.forEach(rec => {
            const idx = merged.findIndex(c => c.id === rec.id);
            if (idx >= 0) merged[idx] = rec; else merged.push(rec);
          });
          resultado = lsSaveCarteira(merged);
          return merged;
        });
        if (resultado && !resultado.ok) { setLsErro(resultado.erro); showToast(`⚠ Falha ao salvar após importar: ${resultado.erro}`); }
        else { setLsErro(null); showToast(`Backup importado: ${validos.length} cliente(s) processado(s).`); }
      } catch (e) {
        showToast('Falha ao importar: arquivo JSON inválido.');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="max-w-[1180px] mx-auto px-4 sm:px-6 py-8">
      <header className="flex flex-col md:flex-row md:items-end md:justify-between gap-5 mb-8">
        <div>
          <p className="text-[12.5px] font-medium mb-1.5" style={{ color: 'var(--petroleo)' }}>G&amp;M Contabilidade · Reforma Tributária do Consumo</p>
          <h1 className="font-display text-[30px] sm:text-[34px] font-semibold leading-tight">Diagnóstico de Enquadramento Tributário 2027</h1>
          <p className="text-[14px] mt-1.5 max-w-[560px]" style={{ color: 'var(--ink-soft)' }}>
            Simples Nacional Tradicional, Simples Híbrido e Lucro Presumido, comparados sob a CBS plena da EC nº 132/2023,
            LC nº 214/2025 e LC nº 227/2026.
          </p>
        </div>
        <SectorToggle setor={d.setor} onChange={(s) => set(exemploPorSetor(s))} />
      </header>

      <div className="card p-4 mb-6">
        <div className="flex flex-col lg:flex-row lg:items-end gap-3 lg:gap-4">
          <div className="flex-1 min-w-0">
            <label className="field-label">Empresa em Análise:</label>
            <select value={activeClienteId} onChange={(e) => selecionarCliente(e.target.value)}>
              <option value="">+ Novo cliente (nenhum selecionado)</option>
              {carteira.map(c => (
                <option key={c.id} value={c.id}>
                  {(c.razaoSocial || '(sem razão social)')} - CNPJ: {c.cnpj || '—'} (Anexo {c.anexo || '—'})
                </option>
              ))}
            </select>
          </div>
          <div className="flex flex-wrap items-center gap-2 shrink-0">
            <button onClick={novoCliente}
              className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg text-[12.5px] font-semibold"
              style={{ background: 'var(--petroleo)', color: '#fff' }}>
              <IconArrowRight className="w-3.5 h-3.5" strokeWidth={2.2} /> Cadastrar / Analisar Novo Cliente
            </button>
            <button onClick={excluirClienteAtivo} disabled={!activeClienteId} title="Excluir cliente selecionado"
              className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg text-[12.5px] font-medium"
              style={{ background: 'var(--rose-tint)', color: 'var(--rose)', opacity: activeClienteId ? 1 : 0.45, cursor: activeClienteId ? 'pointer' : 'not-allowed' }}>
              <IconTrash className="w-3.5 h-3.5" strokeWidth={2} /> Excluir Cliente
            </button>
            <button onClick={exportarBackup} title="Exportar todos os clientes salvos (backup JSON)"
              className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg text-[12.5px] font-medium"
              style={{ background: 'var(--petroleo-tint)', color: 'var(--petroleo)' }}>
              <IconDatabase className="w-3.5 h-3.5" strokeWidth={2} /> Exportar Backup
            </button>
            <button onClick={() => importInputRef.current && importInputRef.current.click()} title="Importar backup JSON de clientes"
              className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg text-[12.5px] font-medium"
              style={{ background: 'var(--petroleo-tint)', color: 'var(--petroleo)' }}>
              <IconUpload className="w-3.5 h-3.5" strokeWidth={2} /> Importar Backup
            </button>
            <input ref={importInputRef} type="file" accept=".json,application/json" className="hidden"
              onChange={(e) => { if (e.target.files && e.target.files[0]) importarBackup(e.target.files[0]); e.target.value = ''; }} />
          </div>
        </div>
        <p className="text-[11.5px] mt-3" style={{ color: 'var(--ink-soft)' }}>
          Carteira: {carteira.length} {carteira.length === 1 ? 'empresa diagnosticada' : 'empresas diagnosticadas'} para 2027 · {db ? 'salvas no banco de dados do Claude (visível a quem acessa este artefato na sua organização)' : 'salvas localmente neste navegador (localStorage), sem envio a servidores externos'}.
        </p>
        {lsErro && (
          <p className="text-[11.5px] mt-2 px-3 py-2 rounded-lg" style={{ background: 'var(--rose-tint)', color: 'var(--rose)' }}>
            ⚠ {lsErro} Os dados preenchidos continuam funcionando na tela, mas não estão sendo salvos permanentemente —
            ao fechar ou recarregar a página, eles serão perdidos.
          </p>
        )}
      </div>

      {d.cnpjMestreLocked && (d.municipioUF || d.uf === 'AM' || d.anexoDetectadoPGDAS) && (
        <div className="card p-3 mb-6 flex flex-col sm:flex-row sm:items-center gap-2" style={{ borderColor: 'var(--emerald)', background: 'var(--emerald-tint)' }}>
          <IconCheckCircle className="w-5 h-5 shrink-0" style={{ color: 'var(--emerald)' }} strokeWidth={1.8} />
          <div className="flex flex-wrap items-center gap-2">
            {d.municipioUF && <span className="text-[12px]" style={{ color: 'var(--ink-soft)' }}>{d.municipioUF}</span>}
            {d.uf === 'AM' && (
              <span className="text-[11px] font-mono px-2 py-0.5 rounded" style={{ background: 'var(--petroleo-tint)', color: 'var(--petroleo)' }}>
                Jurisdição Fiscal: SEFAZ/AM | Alíquota ICMS Modal: 20,00%
              </span>
            )}
            {d.anexoDetectadoPGDAS && (
              <span className="text-[11px] font-mono px-2 py-0.5 rounded" style={{ background: 'var(--violet-tint)', color: 'var(--violet)' }}>
                Anexo Identificado no PGDAS-D: ANEXO {d.anexoDetectadoPGDAS} - {ANEXO_SEGMENTO[d.anexoDetectadoPGDAS]} | Base: LC nº 123/2006 | Status: calibrado
              </span>
            )}
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-[13px] font-medium max-w-[360px]"
          style={{ background: 'var(--petroleo-dark)', color: '#fff' }}>
          {toast}
        </div>
      )}

      {calc.excede && (
        <div className="mb-6">
          <AlertCard tone="amber" Icon={IconAlert} title="RBT12 acima do limite do Simples Nacional (R$ 4.800.000,00)">
            Os cálculos do Simples Nacional Tradicional e Híbrido utilizam a última faixa da tabela como referência, mas a
            empresa está, na prática, obrigada à exclusão do regime. Avalie o enquadramento no Lucro Presumido ou Lucro Real.
          </AlertCard>
        </div>
      )}

      {d.setor === 'servicos' && (
        <div className="mb-6">
          <AlertCard tone={calc.cppNoDAS ? 'petroleo' : 'violet'} Icon={IconInfo}
            title={`Fator R = ${fmtPct(calc.fatorR)} → Anexo ${calc.nomeAnexo} (${calc.cppNoDAS ? 'CPP patronal incluída no DAS' : 'CPP patronal recolhida à parte, fora do DAS'})`}>
            {d.anexoServicosForcado
              ? `Anexo ${d.anexoServicosForcado} identificado no PGDAS-D processado (ou definido manualmente), substituindo o teste automático de Fator R. `
              : ''}
            {calc.nomeAnexo === 'III' && 'A folha de pagamento (anualizada) representa ao menos 28% do RBT12, então a atividade se enquadra no Anexo III da LC 123/2006, cuja alíquota já inclui a CPP patronal.'}
            {calc.nomeAnexo === 'V' && 'A folha de pagamento (anualizada) representa menos de 28% do RBT12, então a atividade se enquadra no Anexo V da LC 123/2006 — a CPP patronal também está incluída na alíquota do DAS neste anexo (só o Anexo IV tem CPP fora do DAS, art. 13, VI, LC 123/2006).'}
            {calc.nomeAnexo === 'IV' && 'A atividade se enquadra no Anexo IV da LC 123/2006 (lista fechada: construção civil, obras de engenharia, vigilância, limpeza e conservação, advocacia) — neste anexo específico a CPP patronal não integra o DAS e é recolhida separadamente, à alíquota única de 20% sobre folha + pró-labore (sem RAT/terceiros), somando-se ao DAS no Tradicional e no Híbrido.'}
            {d.anexoServicosForcado && (
              <>
                {' '}
                <button onClick={() => set({ anexoServicosForcado: null, anexoDetectadoPGDAS: null })}
                  className="underline font-medium" style={{ color: 'inherit' }}>
                  Voltar ao teste automático de Fator R
                </button>
              </>
            )}
          </AlertCard>
        </div>
      )}

      <UploadModule key={resetCounter} setor={d.setor} d={d}
        onApply={applyFromDocs} onLoadExample={(key) => setD(exemploPorSetor(key))} />

      <BenefitsPanel setor={d.setor} comercio={d.beneficios.comercio} servicos={d.beneficios.servicos}
        onChangeComercio={setBeneficiosComercio} onChangeServicos={setBeneficiosServicos} />

      <HistoricoTable d={d} onChangeMes={setHistoricoMes} />

      <div className="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-6">
        <div className="card p-5 h-fit lg:sticky lg:top-4">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display text-[16px] font-semibold">Dados do cliente</h2>
            <IconCalculator className="w-5 h-5" style={{ color: 'var(--petroleo)' }} />
          </div>

          <div className="flex flex-col gap-4">
            <div>
              <label className="field-label">Razão social / nome fantasia</label>
              <input type="text" value={d.razaoSocial} onChange={e => set({ razaoSocial: e.target.value })} placeholder="Ex.: Amazônia Comércio Ltda" />
            </div>
            <div>
              <label className="field-label flex items-center gap-1.5">
                CNPJ
                {d.cnpjMestreLocked && <span className="px-1.5 py-0.5 rounded text-[10px] font-semibold" style={{ background: 'var(--emerald-tint)', color: 'var(--emerald)' }}>mestre fixado</span>}
              </label>
              <input type="text" value={d.cnpj} onChange={e => set(aplicarCnpjDigitado(e.target.value))} placeholder="00.000.000/0000-00"
                disabled={d.cnpjMestreLocked} style={d.cnpjMestreLocked ? { opacity: 0.6, cursor: 'not-allowed' } : {}} />
              {d.cnpjMestreLocked && <p className="text-[11px] mt-1" style={{ color: 'var(--ink-soft)' }}>Bloqueado após o auto-cadastro. Use "Limpar Empresa" para alterar.</p>}
            </div>

            <NumberField label="Faturamento mensal médio" prefix="R$" value={d.faturamentoMensal} step={1000} onChange={v => set({ faturamentoMensal: v })} />
            <NumberField label="RBT12 (receita bruta dos últimos 12 meses)" prefix="R$" value={d.rbt12} step={10000} onChange={v => set({ rbt12: v })} hint="Usado para apurar a alíquota efetiva do Simples Nacional." />
            <NumberField label={isComercio ? 'Compras de mercadorias tributadas / mês' : isIndustria ? 'Compras de matérias-primas e insumos industriais / mês' : 'Insumos/serviços tomados de PJ / mês'} prefix="R$" value={d.comprasMensais} step={1000} onChange={v => set({ comprasMensais: v })} />

            <div>
              <label className="field-label">% adquirido de fornecedores do Regime Normal</label>
              <div className="flex items-center gap-3">
                <input type="range" min="0" max="100" value={d.pctFornecedorRegimeNormal} onChange={e => set({ pctFornecedorRegimeNormal: parseInt(e.target.value) })} />
                <span className="font-mono text-[13px] w-10 text-right">{d.pctFornecedorRegimeNormal}%</span>
              </div>
              <p className="text-[11.5px] mt-1" style={{ color: 'var(--ink-soft)' }}>Compras de optantes do Simples (DAS) não geram crédito pleno de CBS.</p>
            </div>

            <NumberField label="Folha de pagamento bruta mensal" prefix="R$" value={d.folhaMensal} step={500} onChange={v => set({ folhaMensal: v })} />
            <NumberField label="Pró-labore mensal" prefix="R$" value={d.proLabore} step={500} onChange={v => set({ proLabore: v })} />
            <div>
              <label className="field-label">UF do estabelecimento</label>
              <input type="text" maxLength="2" value={d.uf} onChange={e => set({ uf: e.target.value.toUpperCase().slice(0, 2) })} placeholder="AM" />
              <p className="text-[11px] mt-1" style={{ color: 'var(--ink-soft)' }}>Padrão AM (alíquota modal de ICMS 20,00% — Lei Complementar nº 242/2022, que alterou a Lei Complementar nº 19/97).</p>
            </div>
            <NumberField label={!isServicos ? 'Alíquota estadual de ICMS' : 'Alíquota municipal de ISS'} suffix="%" value={d.aliquotaEstMun} step={0.5} onChange={v => set({ aliquotaEstMun: v })}
              hint={!isServicos && d.uf === 'AM' ? 'Alíquota modal do Amazonas (20,00%); ajuste para simular incentivos da ZFM/ALC ou operações interestaduais.' : undefined} />

            <div>
              <label className="field-label">% de vendas / serviços para PJ (B2B) — restante é B2C</label>
              <div className="flex items-center gap-3">
                <input type="range" min="0" max="100" value={d.pctB2B} onChange={e => set({ pctB2B: parseInt(e.target.value) })} />
                <span className="font-mono text-[13px] w-10 text-right">{d.pctB2B}%</span>
              </div>
            </div>
          </div>

          <div className="flex flex-col gap-2 mt-5 pt-4" style={{ borderTop: '1px solid var(--line-soft)' }}>
            <p className="text-[11.5px] font-medium" style={{ color: 'var(--ink-soft)' }}>Casos de exemplo</p>
            <button onClick={() => setD(EXEMPLO_COMERCIO)} className="text-left text-[13px] px-3 py-2 rounded-lg flex items-center justify-between" style={{ background: 'var(--petroleo-tint)', color: 'var(--petroleo)' }}>
              Carregar caso: Comércio Varejista <IconArrowRight className="w-3.5 h-3.5" />
            </button>
            <button onClick={() => setD(EXEMPLO_INDUSTRIA)} className="text-left text-[13px] px-3 py-2 rounded-lg flex items-center justify-between" style={{ background: 'var(--petroleo-tint)', color: 'var(--petroleo)' }}>
              Carregar caso: Indústria <IconArrowRight className="w-3.5 h-3.5" />
            </button>
            <button onClick={() => setD(EXEMPLO_SERVICOS)} className="text-left text-[13px] px-3 py-2 rounded-lg flex items-center justify-between" style={{ background: 'var(--petroleo-tint)', color: 'var(--petroleo)' }}>
              Carregar caso: Empresa de Serviços <IconArrowRight className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>

        <div className="flex flex-col gap-6">
          <div className="card p-5 flex flex-col sm:flex-row sm:items-center gap-4 justify-between" style={{ background: 'var(--emerald-tint)', borderColor: 'var(--emerald)' }}>
            <div className="flex items-center gap-3">
              <IconTrendDown className="w-8 h-8" strokeWidth={1.6} style={{ color: 'var(--emerald)' }} />
              <div>
                <p className="text-[12.5px]" style={{ color: 'var(--ink-soft)' }}>Economia anual estimada ao optar pelo regime recomendado</p>
                <p className="font-display text-[24px] font-semibold" style={{ color: 'var(--emerald)' }}>{fmtBRL(economiaAnual)}</p>
              </div>
            </div>
            <div className="flex flex-wrap items-center gap-2 shrink-0">
              <button onClick={() => setShowParecer(true)} className="flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold" style={{ background: 'var(--petroleo)', color: '#fff' }}>
                <IconFileCheck className="w-4 h-4" strokeWidth={2} /> Gerar parecer técnico
              </button>
              <button onClick={() => setShowMemorial(true)} className="flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold" style={{ background: 'var(--violet)', color: '#fff' }}>
                <IconFileText className="w-4 h-4" strokeWidth={2} /> Memorial de cálculo (Anexo A)
              </button>
              {d.setor !== 'servicos' && d.ncmDetalhado.length > 0 && (
                <button onClick={() => setShowNcmAnexo(true)} className="flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold" style={{ background: 'var(--amber)', color: '#fff' }}>
                  <IconTag className="w-4 h-4" strokeWidth={2} /> NCMs para conferência (Anexo B)
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-5 pt-2">
            {['tradicional', 'hibrido', 'presumido'].map(k => (
              <RegimeCard key={k} regime={regimes[k]} isMelhor={k === calc.melhor} />
            ))}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <AlertCard tone="amber" Icon={IconAlert} title="Split Payment — impacto no fluxo de caixa">
              Nos regimes Simples Híbrido e Lucro Presumido, a CBS incidente em vendas por cartão ou PIX é retida e
              recolhida automaticamente no momento da transação, reduzindo o valor líquido disponibilizado de imediato à
              empresa — em contraste com a guia única mensal do DAS no Simples Tradicional, que não sofre esse destaque.
            </AlertCard>
            {isIndustria ? (
              <AlertCard tone="violet" Icon={IconAlert} title="Alerta da cadeia de suprimentos (B2B)">
                Como indústrias vendem majoritariamente para distribuidores e lojistas PJ, optar pelo Simples Tradicional
                impede o cliente PJ de aproveitar créditos integrais de CBS (8,8%), gerando desvantagem competitiva e risco
                de perda de compradores para indústrias do Regime Normal ou do Simples Híbrido. Com {d.pctB2B}% das vendas
                destinadas a PJ, esse fator tende a pesar na decisão comercial, além do custo tributário isolado.
              </AlertCard>
            ) : (
              <AlertCard tone="petroleo" Icon={IconInfo} title="Impacto comercial na carteira de clientes">
                Com {d.pctB2B}% das operações destinadas a clientes PJ (B2B), {d.pctB2B >= 50
                  ? 'os clientes pessoa jurídica tendem a pressionar por crédito financeiro integral de CBS na nota fiscal, o que reforça o interesse comercial pelos regimes Híbrido e Presumido.'
                  : 'a maior parte das vendas é a consumidor final (B2C), que não aproveita crédito tributário — o que reforça a segurança de manter a margem no Simples Nacional Tradicional.'}
              </AlertCard>
            )}
          </div>
        </div>
      </div>

      <footer className="mt-10 pt-5 text-center text-[12px]" style={{ borderTop: '1px solid var(--line-soft)', color: 'var(--ink-soft)' }}>
        Simulação de caráter orientativo, elaborada com base em premissas da EC nº 132/2023, LC nº 214/2025 e LC nº
        227/2026 para o exercício de 2027. A alíquota de referência da CBS (8,8%) é a projeção oficial vigente,
        sujeita à fixação definitiva por Resolução do Senado Federal até 15/12 (art. 349, LC 214/2025). A dedução do
        Híbrido no DAS usa o percentual de repartição de Cofins/PIS por faixa dos Anexos I e III da LC 123/2006
        (Resolução CGSN nº 94/2011), redistribuído para CBS/IBS. Não substitui análise técnica individualizada.
        G&amp;M Contabilidade LTDA — CRC-AM-010043-O/9.
      </footer>

      {showParecer && <Parecer d={d} calc={calc} onClose={() => setShowParecer(false)} />}
      {showMemorial && <MemorialCalculo d={d} calc={calc} onClose={() => setShowMemorial(false)} />}
      {showNcmAnexo && <AnexoNCM d={d} onClose={() => setShowNcmAnexo(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
